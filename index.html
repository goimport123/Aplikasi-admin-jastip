<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catatan Jastip Online</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      --bg: #f2f5f2;
      --card: #ffffff;
      --ink: #12302b;
      --mute: #62766f;
      --line: #dbe4df;
      --hi: #e8344e;
      --ok: #1a8a5a;
      --soft: #e4efe9;
      --sun: #ffd23f;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1a17;
        --card: #162824;
        --ink: #e7f1ed;
        --mute: #91a8a0;
        --line: #26403a;
        --soft: #1d332d;
      }
    }
    *, *::before, *::after { box-sizing: inherit; }
    html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 15px/1.45 'Plus Jakarta Sans', system-ui, sans-serif;
      padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    }
    header {
      padding: 14px 16px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
    h2 { font-size: 16px; font-weight: 800; margin: 20px 0 8px; }
    .sub { color: var(--mute); font-size: 13px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 12px;
      min-height: 44px;
      padding: 0 14px;
      background: var(--soft);
      font-weight: 600;
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--sun);
      outline-offset: 1px;
    }
    main { padding: 0 14px; max-width: 560px; margin: 0 auto; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
    .chip { flex: none; min-height: 36px; padding: 0 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); }
    .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
    .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .who { font-weight: 800; }
    .item { font-size: 16px; font-weight: 600; }
    .price { font-weight: 800; font-size: 17px; text-align: right; }
    .fx { font-size: 12px; color: var(--mute); }
    .steps { display: flex; gap: 4px; margin: 10px 0 8px; }
    .steps button {
      flex: 1; min-height: 30px; padding: 0; border-radius: 8px; font-size: 10px;
      white-space: nowrap; overflow: hidden; background: var(--line); color: var(--mute);
    }
    .steps button.done { background: var(--soft); color: var(--ink); }
    .steps button.cur { background: var(--ink); color: var(--bg); }
    .acts { display: flex; gap: 8px; }
    .go { flex: 1; background: var(--hi); color: #fff; font-weight: 800; }
    .wa {
      background: #25d366; color: #053b1c; display: inline-flex; align-items: center;
      justify-content: center; min-height: 44px; padding: 0 14px; border-radius: 12px;
      font-weight: 700; text-decoration: none;
    }
    .tag { display: inline-block; font-size: 12px; border-radius: 99px; padding: 2px 10px; font-weight: 600; }
    .lunas { background: #d6f3e3; color: #0d6a42; }
    .utang { background: #ffe3e7; color: #b3182f; }
    .nav {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex;
      background: var(--card); border-top: 1px solid var(--line);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 6px; z-index: 4;
    }
    .nav button { flex: 1; background: none; min-height: 48px; padding: 0 4px; font-size: 13px; }
    .nav button.on { background: var(--soft); font-weight: 800; }
    .fab {
      position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      background: var(--hi); color: #fff; font-weight: 800; border-radius: 99px;
      min-height: 52px; padding: 0 20px; box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 3;
    }
    .hero { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 16px; margin: 10px 0; }
    .hero b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid .card { margin: 0; }
    .grid b { display: block; font-size: 17px; }
    .bar { height: 6px; border-radius: 99px; background: var(--line); margin-top: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--ok); }
    .scrim {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center; z-index: 5;
    }
    .sheet {
      background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh;
      overflow-y: auto; border-radius: 20px 20px 0 0;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    input, select, textarea { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 8px 12px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .prev { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin: 12px 0; font-weight: 600; }
    .primary { width: 100%; background: var(--hi); color: #fff; font-weight: 800; min-height: 50px; margin-top: 8px; }
    .toast {
      position: fixed; left: 12px; right: 12px; bottom: calc(150px + env(safe-area-inset-bottom, 0px));
      background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 12px;
      display: flex; gap: 10px; align-items: center; justify-content: space-between; z-index: 9; max-width: 536px; margin: auto;
    }
    .warn { background: #fff3c4; color: #5b4700; border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 13px; }
    .empty { text-align: center; color: var(--mute); padding: 40px 10px; }
    .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; cursor: zoom-in; border: 1px solid var(--line); }
    .big { width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; background: var(--soft); margin-top: 6px; }
    pre { white-space: pre-wrap; font: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    @media (prefers-reduced-motion: no-preference) {
      .sheet { animation: up .18s ease-out; }
      @keyframes up { from { transform: translateY(30px); opacity: .6; } }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1 id="tn">Catatan Jastip</h1>
    <div class="sub" id="ts">Loading...</div>
  </div>
  <button id="gear" aria-label="Atur trip">Atur</button>
</header>

<main id="m"></main>

<button class="fab" id="fab">+ Pesanan</button>

<nav class="nav">
  <button data-t="q">Pesanan</button>
  <button data-t="c">Pembeli</button>
  <button data-t="p">Packing List</button>
  <button data-t="d">Trip</button>
</nav>

<div id="ov"></div>
<div id="tt"></div>

<script>
// =========================================================================
// CONFIG FIREBASE (Ganti dengan konfigurasi dari Firebase Console Anda)
// =========================================================================
const firebaseConfig = {
  apiKey: "PASTE_API_KEY_DI_SINI",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.appspot.com",
  messagingSenderId: "PASTE_MESSAGING_SENDER_ID",
  appId: "PASTE_APP_ID"
};

let db = null;
if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "PASTE_API_KEY_DI_SINI") {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (err) {
    console.error("Firebase init error:", err);
  }
}

const CUR = { JPY: ['¥', 110], KRW: ['₩', 11.6], SGD: ['S$', 12900], THB: ['฿', 490], HKD: ['HK$', 2100], USD: ['$', 16400], MYR: ['RM', 3900], TWD: ['NT$', 520], EUR: ['€', 19200], AUD: ['A$', 10900], CNY: ['CN¥', 2300] };
const ST = ['Dicari', 'Ketemu', 'Dibeli', 'Dibayar', 'OTW Indo', 'Done'];
const CAT = ['Skincare', 'Makeup', 'Obat & Vitamin', 'Snack & Makanan', 'Fashion', 'Lainnya'];
const K = 'jastip-v1';

const def = () => ({
  trip: { name: 'Trip Jepang', markup: 15, cur: 'JPY' },
  rates: Object.fromEntries(Object.entries(CUR).map(([k, v]) => [k, v[1]])),
  ratesAt: null,
  customers: [],
  orders: [],
  packingLists: [],
  history: [],
  tab: 'q',
  filter: -1
});

let S = def();

try {
  const localData = localStorage.getItem(K);
  if (localData) S = Object.assign(def(), JSON.parse(localData));
} catch (e) { S = def(); }

const save = () => {
  try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {}
  if (db) {
    db.collection('jastip').doc('appData').set(S).catch(err => console.error('Firestore save error:', err));
  }
};

if (db) {
  db.collection('jastip').doc('appData').onSnapshot((doc) => {
    if (doc.exists) {
      S = Object.assign(def(), doc.data());
      if (!S.packingLists) S.packingLists = [];
      try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {}
      render();
    }
  });
}

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const e = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const idr = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const rb = n => n >= 1e6 ? 'Rp ' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '').replace('.', ',') + ' jt' : n >= 1000 ? 'Rp ' + String(+(n / 1000).toFixed(1)).replace('.', ',') + 'rb' : idr(n);
const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isNaN(x) ? 0 : x; };
const sym = c => (CUR[c] || [c])[0];
const fx = (n, c) => sym(c) + ' ' + n.toLocaleString('id-ID', { maximumFractionDigits: 2 });
const cust = id => S.customers.find(c => c.id === id) || { name: '(dihapus)', wa: '', notes: '' };
const cost = o => o.amt * o.qty * o.rate;
const mk = o => o.mt === 'idr' ? o.markup * o.qty : cost(o) * o.markup / 100;
const sell = o => Math.ceil((cost(o) + mk(o)) / 500) * 500;
const paidOf = o => o.paidAmt || 0;
const sisa = o => Math.max(0, sell(o) - paidOf(o));
const bought = o => o.status >= 2;

if (!S.packingLists) S.packingLists = [];

const waNum = n => { n = String(n).replace(/\D/g, ''); return n.startsWith('0') ? '62' + n.slice(1) : n.startsWith('8') ? '62' + n : n; };
const waLink = (w, t) => 'https://wa.me/' + waNum(w) + '?text=' + encodeURIComponent(t);

function msg(o, st) {
  const n = cust(o.cid).name, p = rb(sell(o)), i = o.item + (o.qty > 1 ? ' x' + o.qty : '');
  return [
    `Halo ${n}, lagi aku cariin ${i} ya. Nanti kukabarin kalau ketemu 🙌`,
    `Halo ${n}, ${i} ketemu${o.store ? ' di ' + o.store : ''}! Harganya ${p}, konfirmasi ya?`,
    `Halo ${n}, ${i} sudah kubeli ✅ Total ${p}. Kalau belum transfer, ditunggu ya 🙏`,
    `Makasih ${n}! Pembayaran ${p} untuk ${i} sudah kuterima 💚`,
    `Halo ${n}, ${i} sudah OTW Indo ✈ Nanti kukabarin lagi kalau sudah sampai ya!`,
    `Halo ${n}, ${i} sudah dikirim ke kamu ya 📦 Kabarin kalau sudah sampai, makasih banyak! 💚`
  ][st];
}

function toast(html, ms = 5000) {
  const t = $('#tt');
  t.innerHTML = '<div class="toast">' + html + '</div>';
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.innerHTML = '', ms);
}

function sheet(html) {
  $('#ov').innerHTML = '<div class="scrim" id="sc"><div class="sheet" role="dialog">' + html + '</div></div>';
  $('#sc').onclick = ev => { if (ev.target.id === 'sc') close(); };
}
const close = () => { $('#ov').innerHTML = ''; };

function reqStatus(id, i) {
  const o = S.orders.find(x => x.id === id);
  if (i === 3 && sisa(o) > 0) paySheet(id);
  else setStatus(id, i);
}

function setStatus(id, i) {
  const o = S.orders.find(x => x.id === id);
  o.status = i;
  save(); render();
  toast(`<span>${ST[i]} ✔ ${e(cust(o.cid).name)}${i === 5 && sisa(o) > 0 ? ' · sisa ' + rb(sisa(o)) : ''}</span>` +
    (cust(o.cid).wa ? `<a class="wa" target="_blank" rel="noopener" href="${waLink(cust(o.cid).wa, msg(o, i))}">Kabari WA</a>` : ''));
}

function stat(list) {
  const b = list.filter(bought), rev = b.reduce((s, o) => s + sell(o), 0), c = b.reduce((s, o) => s + cost(o), 0);
  const paid = list.reduce((s, o) => s + paidOf(o), 0);
  return { n: list.length, nb: b.length, rev, c, m: rev - c, paid, out: b.reduce((s, o) => s + sisa(o), 0), wait: list.filter(o => !bought(o)).reduce((s, o) => s + sell(o), 0) };
}

function render() {
  $('#tn').textContent = S.trip.name;
  const s = stat(S.orders);
  $('#ts').textContent = S.orders.length + ' pesanan · untung ' + rb(s.m);
  
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  $('#fab').style.display = (S.tab === 'c' || S.tab === 'p') ? 'none' : '';
  
  $('#m').innerHTML = S.tab === 'q' ? vQ() : S.tab === 'c' ? vC() : S.tab === 'p' ? vP() : vD();
}

function vQ() {
  const cn = i => S.orders.filter(o => i < 0 || o.status === i).length;
  let h = '<div class="chips">' + [-1, 0, 1, 2, 3, 4, 5].map(i => `<button class="chip ${S.filter === i ? 'on' : ''}" data-f="${i}">${i < 0 ? 'Semua' : ST[i]} ${cn(i)}</button>`).join('') + '</div>';
  const L = S.orders.filter(o => S.filter < 0 || o.status === S.filter).sort((a, b) => b.ts - a.ts);
  
  if (!L.length) return h + `<div class="empty">${S.orders.length ? 'Nggak ada pesanan di tahap ini.' : 'Belum ada pesanan.<br>Ketuk <b>+ Pesanan</b> untuk menambahkan!'}</div>`;
  
  return h + L.map(o => {
    const c = cust(o.cid), nx = o.status < 5 ? ST[o.status + 1] : null;
    return `<div class="card">
      <div class="row">
        ${o.photo ? `<img class="thumb" src="${o.photo}" data-z="${o.id}" alt="Foto">` : ''}
        <div style="flex:1">
          <div class="who">${e(c.name)}</div>
          <div class="item">${e(o.item)}${o.qty > 1 ? ' ×' + o.qty : ''}</div>
          <div class="fx">${e(o.store || 'Toko ?')} · ${fx(o.amt, o.cur)}${o.qty > 1 ? '/pcs' : ''}</div>
        </div>
        <div>
          <div class="price">${idr(sell(o))}</div>
          <div style="text-align:right">
            ${bought(o) || paidOf(o) > 0 ? `<button class="tag ${sisa(o) <= 0 ? 'lunas' : 'utang'}" data-pay="${o.id}">${sisa(o) <= 0 ? 'Lunas' : 'Sisa ' + rb(sisa(o))}</button>` : ''}
          </div>
        </div>
      </div>
      <div class="steps">${ST.map((t, i) => `<button data-s="${o.id}:${i}" class="${i < o.status ? 'done' : i === o.status ? 'cur' : ''}">${t}</button>`).join('')}</div>
      <div class="acts">
        ${nx ? `<button class="go" data-s="${o.id}:${o.status + 1}">${nx} ›</button>` : '<button class="go" style="background:var(--ok)" disabled>Selesai 🎉</button>'}
        ${c.wa ? `<a class="wa" target="_blank" rel="noopener" href="${waLink(c.wa, msg(o, o.status))}">WA</a>` : ''}
        <button data-eo="${o.id}">⋯</button>
      </div>
    </div>`;
  }).join('');
}

function vC() {
  const add = '<button class="primary" data-ec="">+ Pelanggan Baru</button>';
  if (!S.customers.length) return add + '<div class="empty">Belum ada data pelanggan.</div>';
  return add + S.customers.map(c => {
    const os = S.orders.filter(o => o.cid === c.id), t = stat(os);
    return `<div class="card">
      <div class="row">
        <div><div class="who">${e(c.name)}</div><div class="fx">${e(c.wa || 'Belum ada WA')}</div></div>
        <div style="text-align:right">
          <div class="fx">${os.length} pesanan</div>
          ${t.out > 0 ? `<span class="tag utang">Kurang ${rb(t.out)}</span>` : os.length ? '<span class="tag lunas">Lunas</span>' : ''}
        </div>
      </div>
      ${c.notes ? `<div style="margin-top:6px;font-size:13px">${e(c.notes)}</div>` : ''}
      <div class="acts" style="margin-top:10px">
        <button data-ec="${c.id}" style="flex:1">Edit</button>
        ${c.wa && t.out > 0 ? `<a class="wa" target="_blank" rel="noopener" href="${waLink(c.wa, tagih(c))}">Tagih WA</a>` : ''}
      </div>
    </div>`;
  }).join('');
}

function vP() {
  const add = '<button class="primary" data-epl="">+ Resi Kargo Baru</button>';
  if (!S.packingLists || !S.packingLists.length) {
    return add + '<div class="empty">Belum ada Packing List Kargo.<br>Buat grup resi untuk melacak box / pengiriman kargo.</div>';
  }
  return add + S.packingLists.map(pl => {
    const os = S.orders.filter(o => (pl.orderIds || []).includes(o.id));
    const custMap = {};
    os.forEach(o => {
      if (!custMap[o.cid]) custMap[o.cid] = [];
      custMap[o.cid].push(o);
    });
    
    let itemsHtml = '';
    const cids = Object.keys(custMap);
    if (!cids.length) {
      itemsHtml = '<div class="sub" style="margin:8px 0;">Belum ada pesanan dimasukkan ke resi ini.</div>';
    } else {
      itemsHtml = cids.map(cid => {
        const c = cust(cid);
        return `<div style="background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0;">
          <div class="who" style="font-size:13px;">👤 ${e(c.name)}</div>
          <div class="sub" style="font-size:12px;margin-top:2px;">
            ${custMap[cid].map(o => '• ' + e(o.item) + (o.qty > 1 ? ' x' + o.qty : '')).join('<br>')}
          </div>
        </div>`;
      }).join('');
    }

    const totalPcs = os.reduce((s, o) => s + (o.qty || 1), 0);

    return `<div class="card">
      <div class="row">
        <div>
          <div class="who" style="font-size:17px;">📦 Resi: ${e(pl.resi)}</div>
          <div class="fx">${e(pl.note || 'Kargo')} · ${os.length} pesanan (${totalPcs} pcs)</div>
        </div>
        <div><span class="tag lunas">${e(pl.status || 'OTW Indo')}</span></div>
      </div>
      <div style="margin-top:8px">${itemsHtml}</div>
      <div class="acts" style="margin-top:10px">
        <button data-epl="${pl.id}" style="flex:1">Kelola / Ubah</button>
        <a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(plSummary(pl))}">Share WA</a>
      </div>
    </div>`;
  }).join('');
}

function plSummary(pl) {
  const os = S.orders.filter(o => (pl.orderIds || []).includes(o.id));
  const custMap = {};
  os.forEach(o => {
    if (!custMap[o.cid]) custMap[o.cid] = [];
    custMap[o.cid].push(o);
  });
  let txt = `📦 PACKING LIST KARGO\nResi: ${pl.resi}\nKet: ${pl.note || '-'}\nStatus: ${pl.status || 'OTW Indo'}\n-------------------------\n`;
  Object.keys(custMap).forEach(cid => {
    txt += `👤 ${cust(cid).name}:\n`;
    custMap[cid].forEach(o => { txt += `  - ${o.item} (x${o.qty})\n`; });
  });
  return txt;
}

function tagih(c) {
  const os = S.orders.filter(o => o.cid === c.id && bought(o) && sisa(o) > 0);
  return `Halo ${c.name}, rincian tagihan jastip yang belum dibayar:\n` +
    os.map(o => '• ' + o.item + ': ' + rb(sisa(o))).join('\n') +
    `\nTotal: ${idr(os.reduce((x, o) => x + sisa(o), 0))}. Terima kasih! 🙏`;
}

function paySheet(id) {
  const o = S.orders.find(x => x.id === id), c = cust(o.cid), p = paidOf(o), r = sisa(o);
  sheet(`<h1>Pembayaran</h1><div class="sub">${e(c.name)} · ${e(o.item)}</div>
  <div class="prev">Total ${idr(sell(o))}<br>Sudah dibayar ${idr(p)}<br><b>Sisa ${idr(r)}</b></div>
  ${r > 0 ? `<button class="primary" id="pf">Bayar Penuh (${idr(r)})</button>
  <label>Atau Bayar Sebagian (Rp)</label><input id="pn" inputmode="numeric" placeholder="100000">
  <button class="primary" id="pp" style="background:var(--ink);color:var(--bg)">Catat Sebagian</button>` : '<div class="prev">Sudah lunas 🎉</div>'}
  ${p > 0 ? '<button style="width:100%;margin-top:10px;color:var(--hi)" id="pz">Reset Pembayaran</button>' : ''}`);

  const apply = a => {
    const x = Math.min(a, r);
    o.paidAmt = p + x;
    if (sisa(o) <= 0 && o.status < 3) o.status = 3;
    save(); close(); render();
    toast(`<span>${sisa(o) > 0 ? 'Tercatat sebagian · sisa ' + rb(sisa(o)) : 'Lunas ✔'}</span>`);
  };

  if (r > 0) {
    $('#pf').onclick = () => apply(r);
    $('#pp').onclick = () => {
      const a = Math.round(num(String($('#pn').value).replace(/\./g, '')));
      if (a <= 0) return toast('Isi nominal terlebih dahulu', 2500);
      apply(a);
    };
  }
  if (p > 0) $('#pz').onclick = () => { o.paidAmt = 0; save(); close(); render(); };
}

function summary() {
  const s = stat(S.orders);
  return `✈️ Rekap ${S.trip.name}\nPesanan: ${s.nb}/${s.n}\nOmzet: ${idr(s.rev)}\nModal: ${idr(s.c)}\nUntung: ${idr(s.m)}\nTerbayar: ${idr(s.paid)}\nBelum Dibayar: ${idr(s.out)}`;
}

function vD() {
  const s = stat(S.orders);
  const used = [...new Set(S.orders.map(o => o.cur).concat(S.trip.cur))];
  return `<div class="hero">
    <span class="sub" style="color:inherit;opacity:.75">Estimasi Untung Bersih</span>
    <b>${idr(s.m)}</b>
    <span style="opacity:.8">Omzet ${idr(s.rev)} − Modal ${idr(s.c)}</span>
  </div>
  <div class="grid">
    <div class="card"><span class="fx">Total Pesanan</span><b>${s.n} (${s.nb} dibeli)</b></div>
    <div class="card"><span class="fx">Uang Masuk</span><b>${idr(s.paid)}</b></div>
    <div class="card"><span class="fx">Sisa Piutang</span><b style="color:var(--hi)">${idr(s.out)}</b></div>
    <div class="card"><span class="fx">Belum Dibeli</span><b>${idr(s.wait)}</b></div>
  </div>
  <h2>Pengaturan Kurs (Rp)</h2>
  <div class="card">
    ${used.map(c => `<label>${c}</label><input inputmode="decimal" data-r="${c}" value="${S.rates[c] ?? ''}">`).join('')}
  </div>
  <h2>Ringkasan Trip</h2>
  <pre>${e(summary())}</pre>
  <div class="acts">
    <button id="bak" style="flex:1">Download Backup JSON</button>
  </div>`;
}

function plSheet(id) {
  const pl = (S.packingLists || []).find(x => x.id === id) || { resi: '', note: '', status: 'OTW Indo', orderIds: [] };
  const eligibleOrders = S.orders;

  let ordersHtml = eligibleOrders.length ? eligibleOrders.map(o => {
    const c = cust(o.cid);
    const checked = (pl.orderIds || []).includes(o.id) ? 'checked' : '';
    return `<label style="display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:4px 0;cursor:pointer;">
      <input type="checkbox" class="pl-chk" value="${o.id}" ${checked} style="width:20px;min-height:20px;margin:0;">
      <div style="flex:1">
        <div style="font-weight:700;font-size:14px;">${e(o.item)} (x${o.qty})</div>
        <div class="fx">${e(c.name)} · ${ST[o.status]}</div>
      </div>
    </label>`;
  }).join('') : '<div class="sub">Belum ada pesanan.</div>';

  sheet(`<h1>${id ? 'Ubah Packing List' : 'Resi Kargo Baru'}</h1>
  <label>Nomor Resi / Kode Kargo</label>
  <input id="pl-r" value="${e(pl.resi)}" placeholder="mis. JP-KG-88910">
  <label>Keterangan / Ekspedisi</label>
  <input id="pl-n" value="${e(pl.note)}" placeholder="mis. Box 1 - Air Cargo">
  <label>Status Kargo</label>
  <select id="pl-s">
    <option ${pl.status === 'Di Warehouse Origin' ? 'selected' : ''}>Di Warehouse Origin</option>
    <option ${pl.status === 'OTW Indo' ? 'selected' : ''}>OTW Indo</option>
    <option ${pl.status === 'Proses Bea Cukai' ? 'selected' : ''}>Proses Bea Cukai</option>
    <option ${pl.status === 'Sampai di Indo' ? 'selected' : ''}>Sampai di Indo</option>
    <option ${pl.status === 'Selesai Unboxing' ? 'selected' : ''}>Selesai Unboxing</option>
  </select>
  <label>Pilih Pesanan Masuk Box/Resi Ini</label>
  <div style="max-height:200px;overflow-y:auto;">${ordersHtml}</div>
  <button class="primary" id="pl-ok">Simpan Packing List</button>
  ${id ? '<button style="width:100%;margin-top:8px;color:var(--hi)" id="pl-del">Hapus</button>' : ''}`);

  $('#pl-ok').onclick = () => {
    const resi = $('#pl-r').value.trim();
    if (!resi) return toast('Nomor resi wajib diisi', 2500);
    const selectedOrderIds = Array.from(document.querySelectorAll('.pl-chk:checked')).map(cb => cb.value);
    const d = { resi, note: $('#pl-n').value.trim(), status: $('#pl-s').value, orderIds: selectedOrderIds };

    if (id) { Object.assign(pl, d); }
    else { S.packingLists.push({ id: uid(), ...d }); }

    save(); close(); render();
    toast('Packing List tersimpan ✔', 2500);
  };

  if (id) {
    $('#pl-del').onclick = () => {
      S.packingLists = S.packingLists.filter(x => x.id !== id);
      save(); close(); render();
    };
  }
}

function orderSheet(id) {
  const o = S.orders.find(x => x.id === id) || { cid: S.customers[0]?.id || '', item: '', store: '', cat: CAT[0], cur: S.trip.cur, amt: '', qty: 1, markup: S.trip.markup, mt: 'pct' };
  let photo = o.photo || '';
  
  sheet(`<h1>${id ? 'Ubah Pesanan' : 'Pesanan Baru'}</h1>
  <label>Pelanggan</label>
  <select id="f-c">${S.customers.map(c => `<option value="${c.id}" ${c.id === o.cid ? 'selected' : ''}>${e(c.name)}</option>`).join('')}<option value="+">+ Pelanggan baru…</option></select>
  <div id="nc" hidden><label>Nama Baru</label><input id="f-nn"><label>Nomor WA</label><input id="f-nw"></div>
  <label>Barang</label><input id="f-i" value="${e(o.item)}" placeholder="Hada Labo Lotion">
  <label>Toko</label><input id="f-s" value="${e(o.store)}" placeholder="Don Quijote">
  <div class="two">
    <div><label>Mata Uang</label><select id="f-u">${Object.keys(S.rates).map(c => `<option ${c === o.cur ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    <div><label>Harga per pcs</label><input id="f-a" inputmode="decimal" value="${o.amt}"></div>
  </div>
  <div class="two">
    <div><label>Jumlah (Qty)</label><input id="f-q" inputmode="numeric" value="${o.qty}"></div>
    <div><label>Markup (%)</label><input id="f-m" inputmode="decimal" value="${o.markup}"></div>
  </div>
  <div class="prev" id="pv"></div>
  <button class="primary" id="f-ok">Simpan Pesanan</button>
  ${id ? '<button style="width:100%;margin-top:8px;color:var(--hi)" id="del">Hapus</button>' : ''}`);

  const pv = () => {
    const cur = $('#f-u').value, r = S.rates[cur] \vert{}\vert{} 0, a = num($('#f-a').value) * Math.max(1, num($('#f-q').value)) * r, m = num($('#f-m').value), p = Math.ceil((a + (a * m / 100)) / 500) * 500;
    $('#pv').innerHTML = a ? `Modal ≈ ${idr(a)}<br>Harga Jual ${idr(p)} <span class="fx">(Untung ${idr(p - a)})</span>` : 'Isi harga untuk menghitung estimasi jual.';
  };
  ['f-u', 'f-a', 'f-q', 'f-m'].forEach(i => $('#' + i).oninput = pv); pv();

  $('#f-c').onchange = () => { $('#nc').hidden = $('#f-c').value !== '+'; };
  
  $('#f-ok').onclick = () => {
    let cid = $('#f-c').value;
    if (cid === '+') {
      const n = $('#f-nn').value.trim();
      if (!n) return toast('Nama pelanggan wajib diisi', 2500);
      cid = uid();
      S.customers.push({ id: cid, name: n, wa: $('#f-nw').value.trim(), notes: '' });
    }
    if (!cid) return toast('Pilih pelanggan terlebih dahulu', 2500);
    const item = $('#f-i').value.trim(), amt = num($('#f-a').value);
    if (!item || !amt) return toast('Nama barang & harga wajib diisi', 2500);
    
    const cur = $('#f-u').value;
    const d = { cid, item, store: $('#f-s').value.trim(), cat: CAT[0], cur, amt, qty: Math.max(1, Math.round(num($('#f-q').value)) \vert{}\vert{} 1), markup: num($('#f-m').value), mt: 'pct', photo };

    if (id) { Object.assign(S.orders.find(z => z.id === id), d); }
    else { S.orders.push({ ...d, id: uid(), rate: S.rates[cur], status: 0, paidAmt: 0, ts: Date.now() }); }

    save(); close(); render();
    toast('Pesanan dicatat ✔', 2500);
  };

  if (id) {
    $('#del').onclick = () => {
      S.orders = S.orders.filter(x => x.id !== id);
      save(); close(); render();
    };
  }
}

function custSheet(id) {
  const c = S.customers.find(x => x.id === id) || { name: '', wa: '', notes: '' };
  sheet(`<h1>${id ? 'Ubah Pelanggan' : 'Pelanggan Baru'}</h1>
  <label>Nama</label><input id="c-n" value="${e(c.name)}">
  <label>WhatsApp</label><input id="c-w" inputmode="tel" value="${e(c.wa)}">
  <label>Catatan</label><textarea id="c-t">${e(c.notes)}</textarea>
  <button class="primary" id="c-ok">Simpan</button>`);

  $('#c-ok').onclick = () => {
    const n = $('#c-n').value.trim();
    if (!n) return toast('Nama wajib diisi', 2500);
    const d = { name: n, wa: $('#c-w').value.trim(), notes: $('#c-t').value.trim() };
    if (id) Object.assign(c, d); else S.customers.push({ id: uid(), ...d });
    save(); close(); render();
  };
}

function tripSheet() {
  sheet(`<h1>Atur Trip</h1>
  <label>Nama Trip</label><input id="t-n" value="${e(S.trip.name)}">
  <label>Markup Standar (%)</label><input id="t-m" inputmode="decimal" value="${S.trip.markup}">
  <button class="primary" id="t-ok">Simpan</button>`);

  $('#t-ok').onclick = () => {
    S.trip.name = $('#t-n').value.trim() || 'Trip Baru';
    S.trip.markup = num($('#t-m').value);
    save(); close(); render();
  };
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.t) { S.tab = d.t; save(); render(); }
  else if (d.f) { S.filter = +d.f; render(); }
  else if (d.s) { const [i, n] = d.s.split(':'); reqStatus(i, +n); }
  else if (d.pay) paySheet(d.pay);
  else if (d.eo) orderSheet(d.eo);
  else if (d.ec !== undefined) custSheet(d.ec);
  else if (d.epl !== undefined) plSheet(d.epl);
  else if (t.id === 'fab') orderSheet();
  else if (t.id === 'gear') tripSheet();
  else if (t.id === 'bak') {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'jastip-backup.json'; a.click();
    URL.revokeObjectURL(url);
  }
});

document.addEventListener('input', ev => {
  const c = ev.target.dataset.r;
  if (c) { S.rates[c] = num(ev.target.value); save(); }
});

render();
</script>
</body>
</html>
