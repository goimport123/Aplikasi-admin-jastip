<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#eef4fb">
  <title>Catatan Jastip Realtime</title>
  
  <!-- Fonts & External Libraries -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      --bg: #eef4fb;
      --card: #fff;
      --ink: #1f3a5c;
      --mute: #5f7896;
      --line: #d6e3f2;
      --acc: #2f6fd1;
      --hi: #d93a4e;
      --ok: #1a8a5a;
      --soft: #dfeafa;
      --sun: #7fb0f2;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) {
        --bg: #0e1a2b;
        --card: #15263d;
        --ink: #e6eefa;
        --mute: #8da6c4;
        --line: #243b5a;
        --soft: #1b3150;
      }
    }
    *, *::before, *::after { box-sizing: inherit; }
    html { height: 100%; -webkit-text-size-adjust: 100%; touch-action: pan-x pan-y; scroll-padding-top: env(safe-area-inset-top, 0px); }
    body { touch-action: pan-x pan-y; margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 'Plus Jakarta Sans', system-ui, sans-serif; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
    
    header { padding: 14px 16px 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
    h2 { font-size: 16px; font-weight: 800; margin: 20px 0 8px; }
    .sub { color: var(--mute); font-size: 13px; }
    
    .cloud-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--acc); display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
    .cloud-badge.online { background: #d6f3e3; color: #0d6a42; }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; border-radius: 12px; min-height: 44px; padding: 0 14px; background: var(--soft); font-weight: 600; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 1px; }
    
    main { padding: 0 14px; max-width: 560px; margin: 0 auto; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
    .chip { flex: none; min-height: 36px; padding: 0 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); }
    .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
    .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .who { font-weight: 800; } .item { font-size: 16px; font-weight: 600; }
    .price { font-weight: 800; font-size: 17px; text-align: right; }
    .fx { font-size: 12px; color: var(--mute); }
    
    .steps { display: flex; gap: 4px; margin: 10px 0 8px; }
    .steps button { flex: 1; min-height: 30px; padding: 0; border-radius: 8px; font-size: 10px; white-space: nowrap; overflow: hidden; background: var(--line); color: var(--mute); }
    .steps button.done { background: var(--soft); color: var(--ink); }
    .steps button.cur { background: var(--ink); color: var(--bg); }
    
    .acts { display: flex; gap: 8px; }
    .go { flex: 1; background: var(--acc); color: #fff; font-weight: 800; }
    .wa { background: #25d366; color: #053b1c; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px; border-radius: 12px; font-weight: 700; text-decoration: none; }
    
    .tag { display: inline-block; font-size: 12px; border-radius: 99px; padding: 1px 8px; font-weight: 600; }
    .lunas { background: #d6f3e3; color: #0d6a42; } .utang { background: #ffe3e7; color: #b3182f; }
    
    .nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
    .nav button { flex: 1; background: none; min-height: 48px; padding: 0 4px; font-size: 14px; }
    .nav button.on { background: var(--soft); font-weight: 800; }
    
    .fab { position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--acc); color: #fff; font-weight: 800; border-radius: 99px; min-height: 52px; padding: 0 20px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
    .hero { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 16px; margin: 10px 0; }
    .hero b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid .card { margin: 0; } .grid b { display: block; font-size: 17px; }
    
    .bar { height: 6px; border-radius: 9px; background: var(--line); margin-top: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--ok); }
    
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 5; }
    .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
    
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    input, select, textarea { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 8px 12px; font-size: 16px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .prev { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin: 12px 0; font-weight: 600; }
    .primary { width: 100%; background: var(--acc); color: #fff; font-weight: 800; min-height: 50px; margin-top: 6px; }
    
    .toast { position: fixed; left: 12px; right: 12px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; z-index: 9; max-width: 536px; margin: auto; }
    .warn { background: #fff3c4; color: #5b4700; border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 13px; }
    .empty { text-align: center; color: var(--mute); padding: 40px 10px; }
    .found { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; cursor: zoom-in; border: 1px solid var(--line); }
    .big { width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; background: var(--soft); margin-top: 6px; }
    pre { white-space: pre-wrap; font: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    @media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6; } } }
  </style>
</head>
<body>

<header>
  <div>
    <h1 id="tn">Catatan Jastip</h1>
    <div class="sub" id="ts"></div>
    <div id="cloud-status" class="cloud-badge">☁️ Menghubungkan Cloud...</div>
  </div>
  <button id="gear" aria-label="Atur trip">Atur</button>
</header>

<main id="m"></main>

<button class="fab" id="fab">+ Pesanan</button>

<nav class="nav">
  <button data-t="q">Pesanan</button>
  <button data-t="p">Packing</button>
  <button data-t="c">Daftar pembeli</button>
  <button data-t="d">Trip</button>
</nav>

<div id="ov"></div>
<div id="tt"></div>

<!-- Module Script: Firebase & Logic Utama -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBX3GOOzJz5e32-VhK_RdXfRzSTnXqBjyk",
    authDomain: "aplikasi-admin-jastip.firebaseapp.com",
    projectId: "aplikasi-admin-jastip",
    storageBucket: "aplikasi-admin-jastip.firebasestorage.app",
    messagingSenderId: "652391383919",
    appId: "1:652391383919:web:1e91cd54623cab61cc9e9a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const docRef = doc(db, "jastip_app", "main_state");

  // 2. Constants & Initial State
  const CUR = { JPY: ['¥', 110], KRW: ['₩', 11.6], SGD: ['S$', 12900], THB: ['฿', 490], HKD: ['HK$', 2100], USD: ['$', 16400], MYR: ['RM', 3900], TWD: ['NT$', 520], EUR: ['€', 19200], AUD: ['A$', 10900], CNY: ['CN¥', 2300] };
  const ST = ['Dicari', 'Ketemu', 'Dibeli', 'Dibayar', 'OTW Indo', 'Done'];
  const CAT = ['Skincare', 'Makeup', 'Obat & Vitamin', 'Snack & Makanan', 'Fashion', 'Lainnya'];
  const K = 'jastip-v1';

  const def = () => ({
    trip: { name: 'Trip baru', markup: 15, cur: 'JPY' },
    rates: Object.fromEntries(Object.entries(CUR).map(([k, v]) => [k, v[1]])),
    ratesAt: null,
    customers: [],
    orders: [],
    history: [],
    tab: 'q',
    filter: -1,
    ships: {},
    pk: 'siap',
    pick: [],
    pdfPrice: true,
    q: '',
    kp: [],
    trips: [],
    tripId: '',
    view: 'cur'
  });

  let S;
  try {
    S = Object.assign(def(), JSON.parse(localStorage.getItem(K) || '{}'));
  } catch (e) {
    S = def();
  }

  let isRemoteSync = false;

  // 3. Cloud & Local Sync Logic
  const updateCloudStatus = (status) => {
    const el = $('#cloud-status');
    if (!el) return;
    if (status === 'connected') {
      el.className = 'cloud-badge online';
      el.innerHTML = '☁️ Realtime Cloud Active';
    } else if (status === 'saving') {
      el.className = 'cloud-badge';
      el.innerHTML = '⏳ Menyimpan...';
    } else {
      el.className = 'cloud-badge';
      el.innerHTML = '⚠️ Mode Offline';
    }
  };

  const save = async () => {
    try {
      localStorage.setItem(K, JSON.stringify(S));
    } catch (e) {
      toast('Memori HP penuh, perubahan disimpan secara lokal sebagian.', 4000);
    }

    if (!isRemoteSync) {
      try {
        updateCloudStatus('saving');
        await setDoc(docRef, S);
        updateCloudStatus('connected');
      } catch (err) {
        console.error("Gagal sinkronisasi ke Firebase:", err);
        updateCloudStatus('offline');
      }
    }
  };

  // Realtime Sync Listener dari Firebase
  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      isRemoteSync = true;
      const cloudData = docSnap.data();
      S = Object.assign(def(), cloudData);
      ensureTrip();
      localStorage.setItem(K, JSON.stringify(S));
      render();
      updateCloudStatus('connected');
      isRemoteSync = false;
    } else {
      save(); // Inisialisasi awal ke cloud jika dokumen belum ada
    }
  }, (error) => {
    console.error("Firebase Error:", error);
    updateCloudStatus('offline');
  });

  // Helpers
  const $ = s => document.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const idr = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
  const rb = n => n >= 1e6 ? 'Rp ' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '').replace('.', ',') + ' jt' : n >= 1000 ? 'Rp ' + String(+(n / 1000).toFixed(1)).replace('.', ',') + 'rb' : idr(n);
  const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isNaN(x) ? 0 : x; };
  const sym = c => (CUR[c] || [c])[0];
  const fx = (n, c) => sym(c) + ' ' + n.toLocaleString('id-ID', { maximumFractionDigits: 2 });
  const cust = id => S.customers.find(c => c.id === id) || { name: '(hapus)', wa: '', notes: '' };
  const cost = o => o.amt * o.qty * o.rate;
  const mk = o => o.mt === 'idr' ? o.markup * o.qty : cost(o) * o.markup / 100;
  const sell = o => Math.ceil((cost(o) + mk(o)) / 500) * 500;
  const paidOf = o => o.paidAmt || 0, sisa = o => Math.max(0, sell(o) - paidOf(o));

  function ensureTrip() {
    if (!S.trips || !S.trips.length) S.trips = [{ id: 't1', name: S.trip.name, ts: Date.now() }];
    if (!S.trips.some(t => t.id === S.tripId)) S.tripId = (S.trips.filter(t => !t.closedAt).pop() || S.trips[S.trips.length - 1]).id;
    S.orders.forEach(o => { if (!o.tripId) o.tripId = S.tripId; });
    if (S.view !== 'cur' && S.view !== 'all' && !S.trips.some(t => t.id === S.view)) S.view = 'cur';
  }

  ensureTrip();
  S.orders.forEach(o => { if (o.paidAmt == null) o.paidAmt = o.paid ? sell(o) : 0; });
  if (!S.v2) { S.orders.forEach(o => { if (o.status === 4) o.status = 5; }); S.v2 = 1; save(); }

  const vid = () => !S.view || S.view === 'cur' ? S.tripId : S.view;
  const vo = () => S.view === 'all' ? S.orders : S.orders.filter(o => o.tripId === vid());
  const tname = id => id === S.tripId ? S.trip.name : ((S.trips.find(t => t.id === id) || {}).name || 'Trip');
  const vname = () => S.view === 'all' ? 'Semua trip' : tname(vid());
  const mkl = o => o.mt === 'idr' ? '+' + idr(o.markup) + '/pcs' : '+' + o.markup + '%';
  const bought = o => o.status >= 2;
  const waNum = n => { n = String(n).replace(/\D/g, ''); return n.startsWith('0') ? '62' + n.slice(1) : n.startsWith('8') ? '62' + n : n; };
  const waLink = (w, t) => 'https://wa.me/' + waNum(w) + '?text=' + encodeURIComponent(t);

  function msg(o, st) {
    const n = cust(o.cid).name, p = rb(sell(o)), i = o.item + (o.qty > 1 ? ' x' + o.qty : '');
    return [
      `Halo ${n}, lagi aku cariin ${i} ya. Nanti kukabarin kalau ketemu 🙌`,
      `Halo ${n}, ${i} ketemu${o.store ? ' di ' + o.store : ''}! Harganya ${p}, konfirmasi ya?`,
      `Halo ${n}, ${i} sudah kubeli ✅ Total ${p}. Kalau belum transfer, ditunggu ya 🙏`,
      `Makasih ${n}! Pembayaran ${p} untuk ${i} sudah kuterima 💚`,
      `Halo ${n}, ${i} sudah OTW Indo ✈️ Nanti kukabarin lagi kalau sudah sampai ya!`,
      `Halo ${n}, ${i} sudah dikirim ke kamu ya 📦 Kabarin kalau sudah sampai, makasih banyak! 💚`
    ][st];
  }

  const payMsg = (o, a) => `Makasih ${cust(o.cid).name}! Pembayaran ${idr(a)} untuk ${o.item} sudah kuterima 💚 ` + (sisa(o) > 0 ? 'Sisa ' + idr(sisa(o)) + ' ya.' : 'Sudah lunas ✅');

  function toast(html, ms = 6000) {
    const t = $('#tt');
    t.innerHTML = '<div class="toast">' + html + '</div>';
    clearTimeout(toast.h);
    toast.h = setTimeout(() => t.innerHTML = '', ms);
  }

  function sheet(html) {
    $('#ov').innerHTML = '<div class="scrim" id="sc"><div class="sheet" role="dialog">' + html + '</div></div>';
    $('#sc').onclick = ev => { if (ev.target.id === 'sc') close(); };
  }
  const close = () => { $('#ov').innerHTML = ''; };

  function reqStatus(id, i) {
    const o = S.orders.find(x => x.id === id);
    if (i === 3 && sisa(o) > 0) paySheet(id);
    else setStatus(id, i);
  }

  function setStatus(id, i) {
    const o = S.orders.find(x => x.id === id);
    o.status = i;
    save();
    render();
  }

  function stat(list) {
    const b = list.filter(bought), rev = b.reduce((s, o) => s + sell(o), 0), c = b.reduce((s, o) => s + cost(o), 0);
    const paid = list.reduce((s, o) => s + paidOf(o), 0);
    return { n: list.length, nb: b.length, rev, c, m: rev - c, paid, out: b.reduce((s, o) => s + sisa(o), 0), wait: list.filter(o => !bought(o)).reduce((s, o) => s + sell(o), 0) };
  }

  // Render Core UI
  function render() {
    $('#tn').textContent = vname() + (S.view !== 'all' && vid() !== S.tripId ? ' (ditutup)' : '');
    const s = stat(vo());
    $('#ts').textContent = vo().length + ' pesanan · untung ' + rb(s.m);
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
    $('#fab').style.display = (S.tab === 'c' || S.tab === 'p') ? 'none' : '';
    $('#m').innerHTML = S.tab === 'q' ? vQ() : S.tab === 'p' ? vP() : S.tab === 'c' ? vC() : vD();
  }

  function vQ() {
    const cn = i => vo().filter(o => i < 0 || o.status === i).length;
    let h = tripBar() + '<div class="chips">' + [-1, 0, 1, 2, 3, 4, 5].map(i => `<button class="chip ${S.filter === i ? 'on' : ''}" data-f="${i}">${i < 0 ? 'Semua' : ST[i]} ${cn(i)}</button>`).join('') + '</div>' + `<input id="qs" placeholder="Cari barang, toko, atau pembeli…" value="${e(S.q || '')}" style="margin:2px 0 4px">`;
    const q = (S.q || '').toLowerCase();
    const L = vo().filter(o => (S.filter < 0 || o.status === S.filter) && (!q || (o.item + ' ' + (o.store || '') + ' ' + cust(o.cid).name).toLowerCase().includes(q))).sort((a, b) => b.ts - a.ts);
    if (!L.length) return h + `<div class="empty">${vo().length ? 'Nggak ada pesanan di tahap ini.' : 'Belum ada pesanan.<br>Ketuk <b>+ Pesanan</b> pas ada yang titip ya!'}</div>`;
    return h + L.map(o => {
      const c = cust(o.cid), nx = o.status < 5 ? ST[o.status + 1] : null;
      return `<div class="card"><div class="row">${o.photo ? `<img class="thumb" src="${o.photo}" data-z="${o.id}" alt="Foto ${e(o.item)}">` : ''}<div style="flex:1"><div class="who">${e(c.name)}</div><div class="item">${e(o.item)}${o.qty > 1 ? ' ×' + o.qty : ''}</div>
<div class="fx">${e(o.store || 'toko ?')} · ${fx(o.amt, o.cur)}${o.qty > 1 ? ' /pcs' : ''} · ${mkl(o)}</div></div>
<div><div class="price">${idr(sell(o))}</div><div style="text-align:right">${bought(o) || paidOf(o) > 0 ? `<button class="tag ${sisa(o) <= 0 ? 'lunas' : 'utang'}" data-pay="${o.id}" style="min-height:32px;padding:0 10px;border:0">${sisa(o) <= 0 ? 'Lunas' : paidOf(o) > 0 ? 'Sebagian · sisa ' + rb(sisa(o)) : 'Belum bayar'}</button>` : ''}</div></div></div>
<div class="steps">${ST.map((t, i) => `<button data-s="${o.id}:${i}" class="${i < o.status ? 'done' : i === o.status ? 'cur' : ''}">${t}</button>`).join('')}</div>
<div class="acts">${nx ? `<button class="go" data-s="${o.id}:${o.status + 1}">${nx} ›</button>` : '<button class="go" style="background:var(--ok)" disabled>Selesai 🎉</button>'}
${c.wa ? `<a class="wa" target="_blank" rel="noopener" href="${waLink(c.wa, msg(o, o.status))}">WA</a>` : ''}
<button data-eo="${o.id}" aria-label="Ubah">⋯</button></div></div>`;
    }).join('');
  }

  function vC() {
    const add = '<button class="primary" data-ec="">+ Pelanggan baru</button>';
    if (!S.customers.length) return add + '<div class="empty">Belum ada pelanggan. Tambah dulu biar gampang pas catat titipan.</div>';
    return add + S.customers.map(c => {
      const os = S.orders.filter(o => o.cid === c.id), t = stat(os);
      return `<div class="card"><div class="row"><div><div class="who">${e(c.name)}</div><div class="fx">${e(c.wa || 'belum ada nomor WA')}</div></div>
<div style="text-align:right"><div class="fx">${os.length} pesanan</div>${t.out > 0 ? `<span class="tag utang">Utang ${rb(t.out)}</span>` : os.length ? '<span class="tag lunas">Beres</span>' : ''}</div></div>
${c.notes ? `<div style="margin-top:6px">${e(c.notes)}</div>` : ''}<div class="acts" style="margin-top:10px"><button data-ec="${c.id}" style="flex:1">Ubah</button>
${c.wa && t.out > 0 ? `<a class="wa" target="_blank" rel="noopener" href="${waLink(c.wa, tagih(c))}">Tagih</a>` : ''}</div></div>`;
    }).join('');
  }

  function tagih(c) {
    const os = S.orders.filter(o => o.cid === c.id && bought(o) && sisa(o) > 0);
    return `Halo ${c.name}, ini rincian yang belum dibayar ya:\n` + os.map(o => '• ' + o.item + (o.qty > 1 ? ' x' + o.qty : '') + ': ' + (paidOf(o) > 0 ? 'sisa ' + rb(sisa(o)) + ' (dari ' + rb(sell(o)) + ')' : rb(sell(o)))).join('\n') + `\nTotal ${idr(os.reduce((x, o) => x + sisa(o), 0))}. Makasih banyak 🙏`;
  }

  function paySheet(id) {
    const o = S.orders.find(x => x.id === id), c = cust(o.cid), p = paidOf(o), r = sisa(o);
    sheet(`<h1>Pembayaran</h1><div class="sub">${e(c.name)} · ${e(o.item)}</div>
<div class="prev">Total ${idr(sell(o))}<br>Sudah dibayar ${idr(p)}<br><b>Sisa ${idr(r)}</b></div>
${r > 0 ? `<button class="primary" id="pf">Bayar penuh (${idr(r)})</button><label>Atau bayar sebagian (nominal Rp)</label><input id="pn" inputmode="numeric" placeholder="mis. 100000"><button class="primary" id="pp" style="background:var(--ink);color:var(--bg)">Catat pembayaran sebagian</button>` : '<div class="prev">Sudah lunas 🎉</div>'}
${p > 0 ? '<button style="width:100%;margin-top:10px;color:var(--hi)" id="pz">Salah catat? Reset pembayaran</button>' : ''}`);
    
    const apply = a => {
      const x = Math.min(a, r); o.paidAmt = p + x;
      if (sisa(o) <= 0 && o.status < 3) o.status = 3;
      save(); close(); render();
      toast(`<span>${sisa(o) > 0 ? 'Tercatat sebagian ✔ sisa ' + rb(sisa(o)) : 'Lunas ✔'}</span>` + (c.wa ? `<a class="wa" target="_blank" rel="noopener" href="${waLink(c.wa, payMsg(o, x))}">Kabari WA</a>` : ''));
    };

    if (r > 0) {
      $('#pf').onclick = () => apply(r);
      $('#pp').onclick = () => {
        const a = Math.round(num(String($('#pn').value).replace(/\./g, '')));
        if (a <= 0) return toast('Isi nominalnya dulu ya', 2500);
        apply(a);
      };
    }
    if (p > 0) $('#pz').onclick = () => {
      const b = $('#pz');
      if (!b.dataset.cf) { b.dataset.cf = 1; return b.textContent = 'Yakin? Ketuk lagi untuk reset ke Rp 0'; }
      o.paidAmt = 0; if (o.status === 3) o.status = 2; save(); close(); render();
    };
  }

  function byCust() { return S.customers.map(c => ({ c, ...stat(vo().filter(o => o.cid === c.id)) })).filter(x => x.n); }
  function topCat() {
    const m = {}; vo().filter(bought).forEach(o => m[o.cat] = (m[o.cat] || 0) + sell(o));
    const a = Object.entries(m).sort((x, y) => y[1] - x[1])[0]; return a ? a[0] : '-';
  }

  function summary() {
    const s = stat(vo()), bc = byCust().sort((a, b) => b.rev - a.rev)[0];
    return `✈️ Rekap ${vname()}\n\nPesanan dibeli: ${s.nb} dari ${s.n}\nSudah Done (terkirim): ${vo().filter(o => o.status === 5).length}\nOmzet: ${idr(s.rev)}\nModal: ${idr(s.c)}\nUntung bersih: ${idr(s.m)}${s.rev ? ' (' + (s.m / s.rev * 100).toFixed(1).replace('.', ',') + '%)' : ''}\nUang masuk: ${idr(s.paid)}\nBelum dibayar: ${idr(s.out)}\nPelanggan teratas: ${bc && bc.rev ? bc.c.name + ' (' + rb(bc.rev) + ')' : '-'}\nKategori terlaris: ${topCat()}`;
  }

  function vD() {
    const s = stat(vo()), bc = byCust().sort((a, b) => b.rev - a.rev), mx = Math.max(1, ...bc.map(x => x.rev));
    const used = [...new Set(vo().map(o => o.cur).concat(S.trip.cur))];
    return `${tripBar()}${S.ratesAt ? '' : '<div class="warn">Kurs masih angka perkiraan. Cek & isi kurs asli di bawah sebelum mulai belanja ya.</div>'}
<div class="hero"><span class="sub" style="color:inherit;opacity:.75">Untung bersih (barang yang sudah dibeli)</span><b>${idr(s.m)}</b>
<span style="opacity:.8">Omzet ${idr(s.rev)} − modal ${idr(s.c)}</span></div>
<div class="grid"><div class="card"><span class="fx">Total pesanan</span><b>${s.n} <span class="fx">(${s.nb} dibeli)</span></b></div>
<div class="card"><span class="fx">Uang masuk</span><b>${idr(s.paid)}</b></div>
<div class="card"><span class="fx">Belum dibayar</span><b style="color:var(--hi)">${idr(s.out)}</b></div>
<div class="card"><span class="fx">Masih dicari/belum dibeli</span><b>${idr(s.wait)}</b></div></div>
<h2>Per pelanggan</h2>${bc.length ? bc.map(x => `<div class="card"><div class="row"><span class="who">${e(x.c.name)}</span><span><b>${idr(x.rev)}</b></span></div>
<div class="fx">${x.n} pesanan · untung ${rb(x.m)}${x.out > 0 ? ' · utang ' + rb(x.out) : ''}</div><div class="bar"><i style="width:${x.rev / mx * 100}%"></i></div></div>`).join('') : '<div class="sub">Belum ada data.</div>'}
<h2>Kurs (Rp per 1 mata uang)</h2><div class="card">${used.map(c => `<label>${c}</label><input inputmode="decimal" data-r="${c}" value="${S.rates[c] ?? ''}">`).join('')}
<button class="primary" style="background:var(--ink);color:var(--bg)" id="live">Coba ambil kurs terbaru</button>
<div class="fx" style="margin-top:6px">${S.ratesAt ? 'Terakhir diatur: ' + S.ratesAt : 'Belum pernah diatur'}. Kurs tiap pesanan dikunci saat dicatat.</div></div>
<h2>Akhir trip</h2><pre>${e(summary())}</pre>
<div class="acts"><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(summary())}" style="flex:1">Bagikan ke WA</a><button id="bak">Simpan cadangan</button></div>
<input type="file" id="imp" accept=".json,application/json" hidden><button style="width:100%;margin-top:8px" data-imp="1">Pulihkan dari cadangan</button>
${histTrips()}${S.view === 'all' || vid() !== S.tripId ? '' : `<button class="primary" style="background:var(--soft);color:var(--ink);margin-top:10px" id="newtrip">Tutup trip (cutoff)</button>`}`;
  }

  function orderSheet(id) {
    const o = S.orders.find(x => x.id === id) || { cid: S.customers[0]?.id || '', item: '', store: '', cat: CAT[0], cur: S.trip.cur, amt: '', qty: 1, markup: S.trip.markup, mt: S.trip.mt || 'pct' };
    let photo = o.photo || '';
    sheet(`<h1>${id ? 'Ubah pesanan' : 'Pesanan baru'}</h1>
<label>Pelanggan</label><select id="f-c">${S.customers.map(c => `<option value="${c.id}" ${c.id === o.cid ? 'selected' : ''}>${e(c.name)}</option>`).join('')}<option value="+">+ Pelanggan baru…</option></select>
<div id="nc" hidden><label>Nama pelanggan baru</label><input id="f-nn" placeholder="mis. Bu Yuni"><label>Nomor WhatsApp</label><input id="f-nw" inputmode="tel" placeholder="0812…"></div>
<label>Barang</label><input id="f-i" value="${e(o.item)}" placeholder="mis. Hada Labo Gokujyun">
<label>Toko</label><input id="f-s" value="${e(o.store)}" placeholder="mis. Matsumoto Kiyoshi">
<div class="two"><div><label>Kategori</label><select id="f-k">${CAT.map(k => `<option ${k === o.cat ? 'selected' : ''}>${k}</option>`).join('')}</select></div><div><label>Dibawa lewat</label><select id="f-pm"><option value="kargo" ${(o.pm || 'kargo') === 'kargo' ? 'selected' : ''}>Kargo</option><option value="koper" ${o.pm === 'koper' ? 'selected' : ''}>Koper</option></select></div></div>
<div class="two"><div><label>Mata uang</label><select id="f-u">${Object.keys(S.rates).map(c => `<option ${c === o.cur ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
<div><label>Harga per pcs</label><input id="f-a" inputmode="decimal" value="${o.amt}"></div></div>
<label>Jumlah</label><input id="f-q" inputmode="numeric" value="${o.qty}">
<label>Markup (untung)</label><div class="two"><select id="f-mt"><option value="pct" ${o.mt !== 'idr' ? 'selected' : ''}>Persen (%)</option><option value="idr" ${o.mt === 'idr' ? 'selected' : ''}>Nominal (Rp per pcs)</option></select><input id="f-m" inputmode="decimal" value="${o.markup}" aria-label="Besar markup"></div>
<label>Foto produk</label><div id="pb"></div>
<input type="file" id="p-cam" accept="image/*" capture="environment" hidden><input type="file" id="p-gal" accept="image/*" hidden>
<div class="prev" id="pv"></div>
<button class="primary" id="f-ok">${id ? 'Simpan' : 'Catat pesanan'}</button>
${id ? '<button style="width:100%;margin-top:8px;color:var(--hi)" id="del">Hapus pesanan</button>' : ''}`);

    const pv = () => {
      const cur = $('#f-u').value, r = S.rates[cur] \vert{}\vert{} 0, a = num($('#f-a').value) * Math.max(1, num($('#f-q').value)) * r, m = num($('#f-m').value), t = $('#f-mt').value, p = Math.ceil((a + (t === 'idr' ? m * Math.max(1, num($('#f-q').value)) : a * m / 100)) / 500) * 500;
      $('#pv').innerHTML = a ? `Modal ≈ ${idr(a)}<br>Jual ${idr(p)} <span class="fx">(untung ${idr(p - a)})</span>` : 'Isi harga dulu, nanti kuhitungin ke rupiah.';
    };

    ['f-u', 'f-a', 'f-q', 'f-m', 'f-mt'].forEach(i => $('#' + i).oninput = pv); pv();
    
    const paint = () => {
      $('#pb').innerHTML = photo ? `<img class="big" src="${photo}" alt="Foto produk"><button id="pr" style="width:100%;margin-top:6px">Hapus foto</button>` : '<div class="two"><button id="pc">📷 Kamera</button><button id="pg">🖼 Galeri</button></div>';
      if (photo) $('#pr').onclick = () => { photo = ''; paint(); };
      else { $('#pc').onclick = () => $('#p-cam').click(); $('#pg').onclick = () => $('#p-gal').click(); }
    };

    const pick = async ev => { const f = ev.target.files[0]; if (!f) return; try { photo = await shrink(f); paint(); } catch (x) { toast('Foto gagal dimuat', 3000); } };
    $('#p-cam').onchange = pick; $('#p-gal').onchange = pick; paint();

    $('#f-c').onchange = () => { $('#nc').hidden = $('#f-c').value !== '+'; };
    $('#f-ok').onclick = () => {
      let cid = $('#f-c').value;
      if (cid === '+') {
        const n = $('#f-nn').value.trim(); if (!n) return toast('Isi nama pelanggan dulu', 2500);
        cid = uid(); S.customers.push({ id: cid, name: n, wa: $('#f-nw').value.trim(), notes: '' });
      }
      if (!cid) return toast('Pilih pelanggan dulu', 2500);
      const item = $('#f-i').value.trim(), amt = num($('#f-a').value);
      if (!item || !amt) return toast('Nama barang & harga wajib diisi', 2500);
      const cur = $('#f-u').value;
      const d = { cid, item, store: $('#f-s').value.trim(), cat: $('#f-k').value, cur, amt, qty: Math.max(1, Math.round(num($('#f-q').value)) \vert{}\vert{} 1), markup: num($('#f-m').value), mt: $('#f-mt').value, photo, pm: $('#f-pm').value };
      
      if (id) {
        const x = S.orders.find(z => z.id === id);
        Object.assign(x, d);
        if (!x.rate || x.cur !== cur) x.rate = S.rates[cur];
      } else {
        S.orders.push({ ...d, id: uid(), rate: S.rates[cur], status: 0, paidAmt: 0, tripId: S.tripId, ts: Date.now() });
        if (S.view !== 'all') S.view = 'cur';
      }
      S.trip.cur = cur; S.trip.markup = d.markup; S.trip.mt = d.mt;
      save(); close(); render(); toast(id ? 'Tersimpan ✔' : 'Pesanan dicatat ✔', 2500);
    };

    if (id) {
      $('#del').onclick = () => {
        if ($('#del').dataset.cf) { S.orders = S.orders.filter(x => x.id !== id); save(); close(); render(); }
        else { $('#del').dataset.cf = 1; $('#del').textContent = 'Yakin hapus? Ketuk lagi'; }
      };
    }
  }

  const SHIP = ['Diproses forwarder', 'OTW Indonesia', 'Tiba di Indonesia', 'Done'];
  const shipIds = () => Object.keys(S.ships).filter(r => S.orders.some(o => o.resi === r));

  function vP() {
    const bo = S.orders.filter(bought), k = shipIds(), kp = bo.filter(o => (o.pm || 'kargo') === 'koper' && !o.resi), h0 = `<div class="chips"><button class="chip ${S.pk === 'k' || S.pk === 'kp' ? '' : 'on'}" data-pk="siap">Perlu dipacking</button><button class="chip ${S.pk === 'kp' ? 'on' : ''}" data-pk="kp">Koper (${kp.length})</button><button class="chip ${S.pk === 'k' ? 'on' : ''}" data-pk="k">Kargo forwarder (${k.length})</button></div>`;
    if (S.pk === 'k') return h0 + vK(k);
    if (S.pk === 'kp') return h0 + vKp(kp);
    const pkd = bo.filter(o => o.packed).length, pc = bo.length ? Math.round(pkd / bo.length * 100) : 0, L = bo.filter(o => !o.resi);
    S.pick = S.pick.filter(id => L.some(o => o.id === id && (o.pm || 'kargo') === 'kargo'));
    let h = h0 + `<div class="hero"><span style="opacity:.75">Progress packing</span><b>${pkd} / ${bo.length} barang (${pc}%)</b><div class="bar"><i style="width:${pc}%;background:var(--sun)"></i></div></div>`;
    if (!L.length) return h + `<div class="empty">${bo.length ? 'Semua barang sudah masuk resi.' : 'Belum ada barang yang dibeli.'}</div>`;
    const g = {}; L.forEach(o => (g[o.cid] = g[o.cid] || []).push(o));
    const cb = 'style="width:22px;min-height:22px"', lb = 'style="margin:0;display:flex;gap:6px;align-items:center"';
    h += Object.keys(g).map(cid => `<div class="card"><div class="who">${e(cust(cid).name)}</div>` + g[cid].map(o => {
      const kg = (o.pm || 'kargo') === 'kargo';
      return `<div class="row" style="margin-top:10px;align-items:center">${o.photo ? `<img class="thumb" src="${o.photo}" data-z="${o.id}" alt="">` : ''}<div style="flex:1;min-width:0"><div class="item">${e(o.item)}${o.qty > 1 ? ' ×' + o.qty : ''}</div><div class="fx">${e(o.store || 'toko ?')}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center"><label ${lb}><input type="checkbox" ${cb} data-pkd="${o.id}" ${o.packed ? 'checked' : ''}>Sudah dipacking</label>
<select data-pm="${o.id}" style="width:auto;min-height:36px"><option value="kargo" ${kg ? 'selected' : ''}>Kargo</option><option value="koper" ${kg ? '' : 'selected'}>Koper</option></select>
${kg ? `<label ${lb}><input type="checkbox" ${cb} data-pick="${o.id}" ${S.pick.includes(o.id) ? 'checked' : ''}>Masuk resi</label>` : ''}</div></div></div>`;
    }).join('') + '</div>').join('');
    return h + (S.pick.length ? `<button class="primary" data-ship="">Buat resi kargo (${S.pick.length} barang)</button>` : '');
  }

  function tripBar() {
    if (S.trips.length < 2) return ''; const cur = S.view || 'cur';
    const o = [['cur', 'Trip aktif: ' + S.trip.name]].concat(S.trips.filter(t => t.closedAt).map(t => [t.id, t.name + ' (ditutup)']), [['all', 'Semua trip']]);
    return `<select data-tv="1" aria-label="Pilih trip" style="margin:6px 0">${o.map(([v, l]) => `<option value="${e(v)}" ${v === cur ? 'selected' : ''}>${e(l)}</option>`).join('')}</select>`;
  }

  function histTrips() {
    const cl = S.trips.filter(t => t.closedAt); if (!cl.length) return '';
    return '<h2>Trip yang sudah ditutup</h2>' + cl.slice().reverse().map(t => {
      const os = S.orders.filter(o => o.tripId === t.id), x = stat(os);
      return `<div class="card"><div class="row"><div class="who">${e(t.name)}</div><span class="fx">ditutup ${new Date(t.closedAt).toLocaleDateString('id-ID')}</span></div>
<div class="fx">${os.length} pesanan · omzet ${rb(x.rev)} · untung ${rb(x.m)}</div>
<div class="acts" style="margin-top:10px"><button class="go" data-tv="${t.id}">Buka trip</button></div></div>`;
    }).join('');
  }

  function vKp(L) {
    const todo = L.filter(o => !o.packed), done = L.length - todo.length, pc = L.length ? Math.round(done / L.length * 100) : 0;
    let h = `<div class="hero"><span style="opacity:.75">Progress koper</span><b>${done} / ${L.length} barang (${pc}%)</b><div class="bar"><i style="width:${pc}%;background:var(--sun)"></i></div></div>`;
    if (!L.length) return h + '<div class="empty">Belum ada barang di koper.</div>';
    const g = {}; L.forEach(o => (g[o.cid] = g[o.cid] || []).push(o));
    h += Object.keys(g).map(cid => `<div class="card"><div class="who">${e(cust(cid).name)}</div>` + g[cid].map(o => `<div class="row" style="margin-top:10px;align-items:center">${o.photo ? `<img class="thumb" src="${o.photo}" data-z="${o.id}">` : ''}<div style="flex:1"><div class="item">${e(o.item)}${o.qty > 1 ? ' ×' + o.qty : ''}</div></div>
${o.packed ? `<span class="tag lunas">Sudah dipacking ✓</span>` : `<label><input type="checkbox" data-kp="${o.id}" ${S.kp.includes(o.id) ? 'checked' : ''}>Pilih</label>`}</div>`).join('') + '</div>').join('');
    return h;
  }

  function vK(k) {
    if (!k.length) return '<div class="empty">Belum ada resi kargo.</div>';
    return k.map(r => {
      const os = S.orders.filter(o => o.resi === r), m = S.ships[r];
      return `<div class="card"><div class="row"><div class="who">${e(r)}</div><span class="tag">${SHIP[m.st || 0]}</span></div>
<div class="fx" style="margin:8px 0">${os.map(o => e(cust(o.cid).name + ': ' + o.item + ' ×' + o.qty)).join('<br>')}</div>
<div class="acts"><button class="go" data-pdf="${e(r)}">Simpan PDF</button><button data-ship="${e(r)}">Ubah</button></div></div>`;
    }).join('');
  }

  function shrink(f) {
    return new Promise((res, rej) => {
      const r = new FileReader(); r.onerror = rej;
      r.onload = () => {
        const i = new Image(); i.onerror = rej;
        i.onload = () => {
          const k = Math.min(1, 640 / Math.max(i.width, i.height)), c = document.createElement('canvas');
          c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
          c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', .72));
        }; i.src = r.result;
      }; r.readAsDataURL(f);
    });
  }

  function custSheet(id) {
    const c = S.customers.find(x => x.id === id) || { name: '', wa: '', notes: '' };
    sheet(`<h1>${id ? 'Ubah pelanggan' : 'Pelanggan baru'}</h1><label>Nama</label><input id="c-n" value="${e(c.name)}"><label>WhatsApp</label><input id="c-w" value="${e(c.wa)}">
<label>Catatan</label><textarea id="c-t">${e(c.notes)}</textarea><button class="primary" id="c-ok">Simpan</button>`);
    $('#c-ok').onclick = () => {
      const n = $('#c-n').value.trim(); if (!n) return toast('Nama wajib diisi', 2500);
      const d = { name: n, wa: $('#c-w').value.trim(), notes: $('#c-t').value.trim() };
      id ? Object.assign(c, d) : S.customers.push({ id: uid(), ...d });
      save(); close(); render();
    };
  }

  function tripSheet() {
    sheet(`<h1>Atur trip</h1><label>Nama trip</label><input id="t-n" value="${e(S.trip.name)}"><button class="primary" id="t-ok">Simpan</button>`);
    $('#t-ok').onclick = () => {
      S.trip.name = $('#t-n').value.trim() || 'Trip baru';
      const ct = S.trips.find(x => x.id === S.tripId); if (ct) ct.name = S.trip.name;
      save(); close(); render();
    };
  }

  // Event Delegation
  document.addEventListener('click', ev => {
    const z = ev.target.closest('[data-z]');
    if (z) {
      const o = S.orders.find(x => x.id === z.dataset.z);
      if (o) sheet(`<div class="who">${e(o.item)}</div><img class="big" style="max-height:70vh" src="${o.photo}" alt=""><button class="primary" id="zc">Tutup</button>`);
      return;
    }
    const t = ev.target.closest('button'); if (!t) return;
    const d = t.dataset;
    if (t.id === 'zc') return close();
    if (d.t) { S.tab = d.t; save(); render(); }
    else if (d.f) { S.filter = +d.f; render(); }
    else if (d.s) { const [i, n] = d.s.split(':'); reqStatus(i, +n); }
    else if (d.pay) paySheet(d.pay);
    else if (d.pk) { S.pk = d.pk; save(); render(); }
    else if (d.tv) { S.view = d.tv; S.filter = -1; S.tab = 'q'; save(); render(); }
    else if (d.eo) orderSheet(d.eo);
    else if (d.ec !== undefined) custSheet(d.ec);
    else if (t.id === 'fab') orderSheet();
    else if (t.id === 'gear') tripSheet();
  });

  document.addEventListener('change', ev => {
    const t = ev.target, d = t.dataset;
    if (d.pkd) { S.orders.find(x => x.id === d.pkd).packed = t.checked; save(); render(); }
    else if (d.pm) { S.orders.find(x => x.id === d.pm).pm = t.value; save(); render(); }
    else if (d.tv) { S.view = t.value; S.filter = -1; save(); render(); }
  });

  render();
</script>
</body>
</html>
