<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#eef4fb">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#eef4fb;--card:#fff;--ink:#1f3a5c;--mute:#5f7896;--line:#d6e3f2;--acc:#2f6fd1;--hi:#d93a4e;--ok:#1a8a5a;--soft:#dfeafa;--sun:#7fb0f2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a2b;--card:#15263d;--ink:#e6eefa;--mute:#8da6c4;--line:#243b5a;--soft:#1b3150}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y;scroll-padding-top:env(safe-area-inset-top,0px)}
body{touch-action:pan-x pan-y;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:16px;font-weight:800;margin:20px 0 8px}
.sub{color:var(--mute);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:0 14px;background:var(--soft);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
main{padding:0 14px;max-width:560px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.orders-list{padding-bottom:8px}.order-card{padding:6px 8px;margin:5px 0;border-radius:12px}.order-card .thumb{width:46px;height:46px}.order-card .price{font-size:14px}.order-card .steps{gap:3px;margin-top:5px}.order-card .steps button{min-height:27px;padding:0 5px;font-size:9px;border-radius:8px}.order-card .acts{gap:4px;margin-top:5px}.order-card .acts button,.order-card .acts .wa{min-height:31px;padding:0 9px;font-size:11px}
.order-card .row{gap:7px}
.order-card .who{font-size:13px}
.order-card .item{font-size:14px;line-height:1.25}
.order-card .fx{font-size:11px;line-height:1.3}
.order-card .price{font-size:14px}
.order-card .thumb{width:44px;height:44px;border-radius:8px}
.order-card .steps{gap:3px;margin:6px 0 5px}
.order-card .steps button{min-height:25px;font-size:9px;border-radius:7px}
.order-card .acts{gap:5px}
.order-card .acts button,.order-card .acts .wa{min-height:34px;padding:0 9px;border-radius:9px;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who{font-weight:800}.item{font-size:16px;font-weight:600}
.price{font-weight:800;font-size:17px;text-align:right}
.fx{font-size:12px;color:var(--mute)}
.steps{display:flex;gap:4px;margin:10px 0 8px}
.steps button{flex:1;min-height:30px;padding:0;border-radius:8px;font-size:10px;white-space:nowrap;overflow:hidden;background:var(--line);color:var(--mute)}
.steps button.done{background:var(--soft);color:var(--ink)}
.steps button.cur{background:var(--ink);color:var(--bg)}
.acts{display:flex;gap:8px}
.go{flex:1;background:var(--acc);color:#fff;font-weight:800}
.wa{background:#25d366;color:#053b1c;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;text-decoration:none}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 8px;font-weight:600}
.lunas{background:#d6f3e3;color:#0d6a42}.utang{background:#ffe3e7;color:#b3182f}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
.nav button{flex:1;background:none;min-height:48px;padding:0 4px;font-size:14px}
.nav button.on{background:var(--soft);font-weight:800}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;font-weight:800;border-radius:99px;min-height:52px;padding:0 20px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;margin:10px 0}
.hero b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .card{margin:0}.grid b{display:block;font-size:17px}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:8px 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prev{background:var(--soft);border-radius:12px;padding:10px 12px;margin:12px 0;font-weight:600}
.primary{width:100%;background:var(--acc);color:#fff;font-weight:800;min-height:50px;margin-top:6px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:9;max-width:536px;margin:auto}
.warn{background:#fff3c4;color:#5b4700;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.found{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;cursor:zoom-in;border:1px solid var(--line)}
.big{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--soft);margin-top:6px}
pre{white-space:pre-wrap;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head><body>
<header><div><h1 id="tn"></h1><div class="sub" id="ts"></div><div class="fx" id="cs">☁ Menghubungkan…</div></div><button id="gear" aria-label="Atur trip">Atur</button></header>
<main id="m"></main>
<button class="fab" id="fab">+ Pesanan</button>
<nav class="nav"><button data-t="q">Pesanan</button><button data-t="p">Packing</button><button data-t="c">Daftar pembeli</button><button data-t="d">Trip</button></nav>
<div id="ov"></div><div id="tt"></div>
<script>
const CUR={JPY:['¥',110],KRW:['₩',11.6],SGD:['S$',12900],THB:['฿',490],HKD:['HK$',2100],USD:['$',16400],MYR:['RM',3900],TWD:['NT$',520],EUR:['€',19200],AUD:['A$',10900],CNY:['CN¥',2300]};
const ST=['Dicari','Ketemu','Dibeli','Dibayar','OTW Indo','Done'];
const CAT=['Skincare','Makeup','Obat & Vitamin','Snack & Makanan','Fashion','Lainnya'];
const firebaseConfig={
  apiKey:"AIzaSyBX3GOOzJz5e32-VhK_RdXfRzSTnXqBjyk",
  authDomain:"aplikasi-admin-jastip.firebaseapp.com",
  projectId:"aplikasi-admin-jastip",
  storageBucket:"aplikasi-admin-jastip.firebasestorage.app",
  messagingSenderId:"652391383919",
  appId:"1:652391383919:web:1e91cd54623cab61cc9e9a"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(), auth=firebase.auth(), storage=firebase.storage();
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}

const K='jastip-v2';
const CLIENT_ID=(localStorage.getItem(K+'-client')||('c-'+Math.random().toString(36).slice(2,10))).toString();
localStorage.setItem(K+'-client',CLIENT_ID);
const def=()=>({trip:{name:'Trip baru',markup:15,cur:'JPY'},rates:Object.fromEntries(Object.entries(CUR).map(([k,v])=>[k,v[1]])),ratesAt:null,customers:[],orders:[],history:[],tab:'q',filter:-1,ships:{},pk:'siap',pick:[],pdfPrice:true,q:'',kp:[],trips:[],tripId:'',view:'cur'});
let S=def();
let localPending=false;
let localEditAt=Number(localStorage.getItem(K+'-edit-at')||0);
let cloudMetaCache=null;
function loadCache(){
  try{
    const x=JSON.parse(localStorage.getItem(K)||'null');
    if(x)S=Object.assign(def(),x);
    localPending=localStorage.getItem(K+'-pending')==='1';
  }catch(e){}
}
loadCache();
let cloudReady=false,cloudBooted=false,cloudWriting=false,cloudTimer=null,cloudDirty=false,cloudState='connecting',cloudStarted=false;
let initialCloud={customers:false,orders:false,trips:false,ships:false,meta:false};
const cloudShadow={customers:{},orders:{},trips:{},ships:{},meta:''};

function stable(x){return JSON.stringify(x,(k,v)=>v&&v.toDate?v.toDate().toISOString():v)}
function metaPlain(){return {trip:S.trip,rates:S.rates,ratesAt:S.ratesAt,history:S.history,tab:S.tab,filter:S.filter,pk:S.pk,pick:S.pick,pdfPrice:S.pdfPrice,q:S.q,kp:S.kp,tripId:S.tripId,view:S.view,v2:S.v2||1,updatedAtMs:localEditAt||0,clientId:CLIENT_ID}}
function metaData(){return {...metaPlain(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}}
function setCloudState(state){cloudState=state;const el=$('#cs');if(el)el.textContent=state==='online'?'☁ Tersimpan & sinkron':state==='saving'?'☁ Menyimpan…':state==='error'?'☁ Belum tersimpan':'☁ Menghubungkan…'}
function cacheSave(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+'-pending',localPending?'1':'0');localStorage.setItem(K+'-pending-ts',String(Date.now()));localStorage.setItem(K+'-edit-at',String(localEditAt||0))}catch(e){toast('Penyimpanan HP gagal. Browser ini mungkin memblokir localStorage.',7000)}}
function save(){localEditAt=Date.now();localPending=true;cacheSave();cloudDirty=true;if(!cloudReady||cloudWriting)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(syncCloud,120)}
function currentDocs(){const docs={customers:{},orders:{},trips:{},ships:{},meta:metaPlain()};S.customers.forEach(x=>docs.customers[x.id]=x);S.orders.forEach(x=>docs.orders[x.id]=cloudOrder(x));S.trips.forEach(x=>docs.trips[x.id]=x);Object.entries(S.ships||{}).forEach(([id,x])=>docs.ships[id]=x);return docs}
function rebuildFromCloud(){
  if(!cloudMetaCache && !Object.values(cloudShadow).some(v=>Object.keys(v).length)) return false;
  const cs=[];Object.values(cloudShadow.customers).forEach(sig=>{});
  return true;
}
function cloudOrder(o){const x={...o};if(typeof x.photo==='string'&&x.photo.startsWith('data:'))x.photo='';return x}
async function syncCloud(){if(!cloudReady||cloudWriting)return;cloudWriting=true;cloudDirty=false;setCloudState('saving');try{const docs=currentDocs(),ops=[];for(const col of ['customers','orders','trips','ships']){const now=docs[col],old=cloudShadow[col];for(const [id,data] of Object.entries(now)){const sig=stable(data);if(old[id]!==sig)ops.push({type:'set',col,id,data,sig})}for(const id of Object.keys(old)){if(!(id in now))ops.push({type:'delete',col,id})}}const metaSig=stable(docs.meta);if(cloudShadow.meta!==metaSig)ops.push({type:'meta',sig:metaSig});for(let i=0;i<ops.length;i+=450){const batch=db.batch(),chunk=ops.slice(i,i+450);chunk.forEach(op=>{if(op.type==='set')batch.set(db.collection(op.col).doc(op.id),op.data);else if(op.type==='delete')batch.delete(db.collection(op.col).doc(op.id));else batch.set(db.collection('settings').doc('app'),metaData(),{merge:true})});await batch.commit();chunk.forEach(op=>{if(op.type==='set')cloudShadow[op.col][op.id]=op.sig;else if(op.type==='delete')delete cloudShadow[op.col][op.id];else cloudShadow.meta=op.sig})}const after=stable(currentDocs());if(after===stable(docs)){localPending=false;cloudDirty=false;cloudMetaCache={...(cloudMetaCache||{}),updatedAtMs:localEditAt,clientId:CLIENT_ID};localStorage.setItem(K+'-pending','0');setCloudState('online')}else{localPending=true;cloudDirty=true;cacheSave()}}catch(err){console.error(err);localPending=true;cloudDirty=true;cacheSave();setCloudState('error');toast('Perubahan belum tersimpan ke Firebase. Data tetap ada di HP dan akan dicoba lagi.',6000)}finally{cloudWriting=false;if(cloudDirty){clearTimeout(cloudTimer);cloudTimer=setTimeout(syncCloud,300)}}}
function shadowCollection(col,snap){cloudShadow[col]={};snap.forEach(d=>cloudShadow[col][d.id]=stable(cloudOrder(d.data())))}
function cloudObjects(col){const out=[];Object.keys(cloudShadow[col]).forEach(id=>{try{out.push(JSON.parse(cloudShadow[col][id]))}catch(e){}});return out}
function applyMeta(snap){if(!snap.exists)return;const x=snap.data()||{};cloudMetaCache=x;if(x.trip)S.trip=x.trip;if(x.rates)S.rates=x.rates;if(x.ratesAt!==undefined)S.ratesAt=x.ratesAt;['history','tab','filter','pk','pick','pdfPrice','q','kp','tripId','view','v2'].forEach(k=>{if(x[k]!==undefined)S[k]=x[k]})}
function cloudError(err){console.error(err);setCloudState('error');localPending=true;cacheSave();toast('Firebase gagal tersambung/menyimpan. Data lokal tetap dipertahankan.',7000)}
async function photoBlob(dataUrl){return await (await fetch(dataUrl)).blob()}
async function uploadPhoto(orderId,dataUrl){const ref=storage.ref().child('orders/'+orderId+'/photo.jpg');await ref.put(await photoBlob(dataUrl),{contentType:'image/jpeg',cacheControl:'public,max-age=31536000'});return {url:await ref.getDownloadURL(),path:ref.fullPath}}
async function deletePhoto(path){if(!path)return;try{await storage.ref(path).delete()}catch(e){if(e&&e.code!=='storage/object-not-found')console.warn(e)}}
async function migrateLegacyPhotos(){const legacy=S.orders.filter(o=>typeof o.photo==='string'&&o.photo.startsWith('data:'));if(!legacy.length)return;for(const o of legacy){try{const r=await uploadPhoto(o.id,o.photo);o.photo=r.url;o.photoPath=r.path;cacheSave()}catch(e){console.error(e);toast('Ada foto lama yang belum berhasil dipindahkan ke Storage.',5000)}}}
async function cloudTick(){if(!Object.values(initialCloud).every(Boolean))return;if(!cloudBooted){cloudBooted=true;loadCache();ensureTrip();S.orders.forEach(o=>{if(o.paidAmt==null)o.paidAmt=o.paid?sell(o):0});if(!S.v2){S.orders.forEach(o=>{if(o.status===4)o.status=5});S.v2=1}
  const cloudMs=Number((cloudMetaCache||{}).updatedAtMs||0);
  const pendingMs=Number(localStorage.getItem(K+'-edit-at')||localEditAt||0);
  const hasCloudData=Object.values(cloudShadow.customers).length||Object.values(cloudShadow.orders).length||Object.values(cloudShadow.trips).length;
  if(hasCloudData && (!localPending || pendingMs<=cloudMs)){
    S.customers=cloudObjects('customers');
    S.orders=cloudObjects('orders');
    S.trips=cloudObjects('trips');
    S.ships={};Object.keys(cloudShadow.ships).forEach(id=>{try{S.ships[id]=JSON.parse(cloudShadow.ships[id])}catch(e){}});
    applyMeta({exists:!!cloudMetaCache,data:()=>cloudMetaCache||{}});
    localPending=false;
  }else if(localPending){toast('Memulihkan perubahan terakhir dari HP…',3000)}
  await migrateLegacyPhotos();cloudReady=true;
  if(localPending||!hasCloudData){cloudDirty=true;await syncCloud()}else{cacheSave();setCloudState('online')}
}cacheSave();render()}
function startCloud(){if(cloudStarted)return;cloudStarted=true;db.collection('customers').onSnapshot(s=>{initialCloud.customers=true;shadowCollection('customers',s);if(cloudBooted&&!localPending){S.customers=s.docs.map(d=>d.data())}cloudTick()},cloudError);db.collection('orders').onSnapshot(s=>{initialCloud.orders=true;shadowCollection('orders',s);if(cloudBooted&&!localPending){S.orders=s.docs.map(d=>d.data())}cloudTick()},cloudError);db.collection('trips').onSnapshot(s=>{initialCloud.trips=true;shadowCollection('trips',s);if(cloudBooted&&!localPending){S.trips=s.docs.map(d=>d.data())}cloudTick()},cloudError);db.collection('ships').onSnapshot(s=>{initialCloud.ships=true;shadowCollection('ships',s);if(cloudBooted&&!localPending){S.ships={};s.forEach(d=>S.ships[d.id]=d.data())}cloudTick()},cloudError);db.collection('settings').doc('app').onSnapshot(s=>{initialCloud.meta=true;cloudMetaCache=s.exists?s.data():null;if(!cloudBooted)cloudShadow.meta=s.exists?stable(s.data()):'';else if(!localPending)applyMeta(s);cloudTick()},cloudError)}
auth.onAuthStateChanged(user=>{if(user){setCloudState('connecting');startCloud()}});
auth.signInAnonymously().catch(err=>{console.error(err);setCloudState('error');localPending=true;cacheSave();toast('Login Firebase gagal. Aktifkan Anonymous Authentication di Firebase Console.',9000);render()});
addEventListener('online',()=>{if(localPending&&cloudReady){clearTimeout(cloudTimer);cloudTimer=setTimeout(syncCloud,100)}});
addEventListener('beforeunload',()=>cacheSave());
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idr=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const rb=n=>n>=1e6?'Rp '+(n/1e6).toFixed(2).replace(/\.?0+$/,'').replace('.',',')+' jt':n>=1000?'Rp '+String(+(n/1000).toFixed(1)).replace('.',',')+'rb':idr(n);
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?0:x};
const sym=c=>(CUR[c]||[c])[0];
const fx=(n,c)=>sym(c)+' '+n.toLocaleString('id-ID',{maximumFractionDigits:2});
const cust=id=>S.customers.find(c=>c.id===id)||{name:'(hapus)',wa:'',notes:''};
const cost=o=>o.amt*o.qty*o.rate;
const mk=o=>o.mt==='idr'?o.markup*o.qty:cost(o)*o.markup/100;
const sell=o=>Math.ceil((cost(o)+mk(o))/500)*500;
const paidOf=o=>o.paidAmt||0,sisa=o=>Math.max(0,sell(o)-paidOf(o));

function ensureTrip(){if(!S.trips||!S.trips.length)S.trips=[{id:'t1',name:S.trip.name,ts:Date.now()}];
if(!S.trips.some(t=>t.id===S.tripId))S.tripId=(S.trips.filter(t=>!t.closedAt).pop()||S.trips[S.trips.length-1]).id;
S.orders.forEach(o=>{if(!o.tripId)o.tripId=S.tripId});if(S.view!=='cur'&&S.view!=='all'&&!S.trips.some(t=>t.id===S.view))S.view='cur'}
const vid=()=>!S.view||S.view==='cur'?S.tripId:S.view;
const vo=()=>S.view==='all'?S.orders:S.orders.filter(o=>o.tripId===vid());
const tname=id=>id===S.tripId?S.trip.name:((S.trips.find(t=>t.id===id)||{}).name||'Trip');
const vname=()=>S.view==='all'?'Semua trip':tname(vid());
const mkl=o=>o.mt==='idr'?'+'+idr(o.markup)+'/pcs':'+'+o.markup+'%';
const bought=o=>o.status>=2;
const waNum=n=>{n=String(n).replace(/\D/g,'');return n.startsWith('0')?'62'+n.slice(1):n.startsWith('8')?'62'+n:n};
const waLink=(w,t)=>'https://wa.me/'+waNum(w)+'?text='+encodeURIComponent(t);
function msg(o,st){const n=cust(o.cid).name,p=rb(sell(o)),i=o.item+(o.qty>1?' x'+o.qty:'');
return [`Halo ${n}, lagi aku cariin ${i} ya. Nanti kukabarin kalau ketemu 🙌`,
`Halo ${n}, ${i} ketemu${o.store?' di '+o.store:''}! Harganya ${p}, konfirmasi ya?`,
`Halo ${n}, ${i} sudah kubeli ✅ Total ${p}. Kalau belum transfer, ditunggu ya 🙏`,
`Makasih ${n}! Pembayaran ${p} untuk ${i} sudah kuterima 💚`,
`Halo ${n}, ${i} sudah OTW Indo ✈️ Nanti kukabarin lagi kalau sudah sampai ya!`,
`Halo ${n}, ${i} sudah dikirim ke kamu ya 📦 Kabarin kalau sudah sampai, makasih banyak! 💚`][st]}
const payMsg=(o,a)=>`Makasih ${cust(o.cid).name}! Pembayaran ${idr(a)} untuk ${o.item} sudah kuterima 💚 `+(sisa(o)>0?'Sisa '+idr(sisa(o))+' ya.':'Sudah lunas ✅')
function toast(html,ms=6000){const t=$('#tt');t.innerHTML='<div class="toast">'+html+'</div>';clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',ms)}
function sheet(html){$('#ov').innerHTML='<div class="scrim" id="sc"><div class="sheet" role="dialog">'+html+'</div></div>';$('#sc').onclick=ev=>{if(ev.target.id==='sc')close()}}
const close=()=>{$('#ov').innerHTML=''};
function reqStatus(id,i){const o=S.orders.find(x=>x.id===id);if(i===3&&sisa(o)>0)paySheet(id);else setStatus(id,i)}
function setStatus(id,i){const o=S.orders.find(x=>x.id===id);o.status=i;save();render()}
function stat(list){const b=list.filter(bought),rev=b.reduce((s,o)=>s+sell(o),0),c=b.reduce((s,o)=>s+cost(o),0);
const paid=list.reduce((s,o)=>s+paidOf(o),0);return{n:list.length,nb:b.length,rev,c,m:rev-c,paid,out:b.reduce((s,o)=>s+sisa(o),0),wait:list.filter(o=>!bought(o)).reduce((s,o)=>s+sell(o),0)}}

function render(){
$('#tn').textContent=vname()+(S.view!=='all'&&vid()!==S.tripId?' (ditutup)':'');const s=stat(vo());$('#ts').textContent=vo().length+' pesanan · untung '+rb(s.m);
document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
$('#fab').style.display=(S.tab==='c'||S.tab==='p')?'none':'';
$('#m').innerHTML=S.tab==='q'?vQ():S.tab==='p'?vP():S.tab==='c'?vC():vD();}

function vQ(){
const cn=i=>vo().filter(o=>i<0||o.status===i).length;
let h=tripBar()+'<div class="chips">'+[-1,0,1,2,3,4,5].map(i=>`<button class="chip ${S.filter===i?'on':''}" data-f="${i}">${i<0?'Semua':ST[i]} ${cn(i)}</button>`).join('')+'</div>'+`<input id="qs" placeholder="Cari barang, toko, atau pembeli…" value="${e(S.q||'')}" style="margin:2px 0 4px">`;
const q=(S.q||'').toLowerCase();const L=vo().filter(o=>(S.filter<0||o.status===S.filter)&&(!q||(o.item+' '+(o.store||'')+' '+cust(o.cid).name).toLowerCase().includes(q))).sort((a,b)=>b.ts-a.ts);
if(!L.length)return h+`<div class="empty">${vo().length?'Nggak ada pesanan di tahap ini.':'Belum ada pesanan.<br>Ketuk <b>+ Pesanan</b> pas ada yang titip ya!'}</div>`;
return h+`<div class="orders-list">`+L.map(o=>{const c=cust(o.cid),nx=o.status<5?ST[o.status+1]:null;
return `<div class="card order-card"><div class="row">${o.photo?`<img class="thumb" src="${o.photo}" data-z="${o.id}" alt="Foto ${e(o.item)}">`:''}<div style="flex:1"><div class="who">${e(c.name)}</div><div class="item">${e(o.item)}${o.qty>1?' ×'+o.qty:''}</div>
<div class="fx">${e(o.store||'toko ?')} · ${fx(o.amt,o.cur)}${o.qty>1?' /pcs':''} · ${mkl(o)}</div></div>
<div><div class="price">${idr(sell(o))}</div><div style="text-align:right">${bought(o)||paidOf(o)>0?`<button class="tag ${sisa(o)<=0?'lunas':'utang'}" data-pay="${o.id}" style="min-height:32px;padding:0 10px;border:0">${sisa(o)<=0?'Lunas':paidOf(o)>0?'Sebagian · sisa '+rb(sisa(o)):'Belum bayar'}</button>`:''}</div></div></div>
<div class="steps">${ST.map((t,i)=>`<button data-s="${o.id}:${i}" class="${i<o.status?'done':i===o.status?'cur':''}">${t}</button>`).join('')}</div>
<div class="acts">${nx?`<button class="go" data-s="${o.id}:${o.status+1}">${nx} ›</button>`:'<button class="go" style="background:var(--ok)" disabled>Selesai 🎉</button>'}
${c.wa?`<a class="wa" target="_blank" rel="noopener" href="${waLink(c.wa,msg(o,o.status))}">WA</a>`:''}
<button data-eo="${o.id}" aria-label="Ubah">⋯</button></div></div>`}).join('')+'</div>'}

function vC(){
const add='<button class="primary" data-ec="">+ Pelanggan baru</button>';
if(!S.customers.length)return add+'<div class="empty">Belum ada pelanggan. Tambah dulu biar gampang pas catat titipan.</div>';
return add+S.customers.map(c=>{const os=S.orders.filter(o=>o.cid===c.id),t=stat(os);
return `<div class="card"><div class="row"><div><div class="who">${e(c.name)}</div><div class="fx">${e(c.wa||'belum ada nomor WA')}</div></div>
<div style="text-align:right"><div class="fx">${os.length} pesanan</div>${t.out>0?`<span class="tag utang">Utang ${rb(t.out)}</span>`:os.length?'<span class="tag lunas">Beres</span>':''}</div></div>
${c.notes?`<div style="margin-top:6px">${e(c.notes)}</div>`:''}<div class="acts" style="margin-top:10px"><button data-ec="${c.id}" style="flex:1">Ubah</button>
${c.wa&&t.out>0?`<a class="wa" target="_blank" rel="noopener" href="${waLink(c.wa,tagih(c))}">Tagih</a>`:''}</div></div>`}).join('')}

function tagih(c){const os=S.orders.filter(o=>o.cid===c.id&&bought(o)&&sisa(o)>0);
return `Halo ${c.name}, ini rincian yang belum dibayar ya:\n`+os.map(o=>'• '+o.item+(o.qty>1?' x'+o.qty:'')+': '+(paidOf(o)>0?'sisa '+rb(sisa(o))+' (dari '+rb(sell(o))+')':rb(sell(o)))).join('\n')+`\nTotal ${idr(os.reduce((x,o)=>x+sisa(o),0))}. Makasih banyak 🙏`}
function paySheet(id){const o=S.orders.find(x=>x.id===id),c=cust(o.cid),p=paidOf(o),r=sisa(o);
sheet(`<h1>Pembayaran</h1><div class="sub">${e(c.name)} · ${e(o.item)}</div>
<div class="prev">Total ${idr(sell(o))}<br>Sudah dibayar ${idr(p)}<br><b>Sisa ${idr(r)}</b></div>
${r>0?`<button class="primary" id="pf">Bayar penuh (${idr(r)})</button><label>Atau bayar sebagian (nominal Rp)</label><input id="pn" inputmode="numeric" placeholder="mis. 100000"><button class="primary" id="pp" style="background:var(--ink);color:var(--bg)">Catat pembayaran sebagian</button>`:'<div class="prev">Sudah lunas 🎉</div>'}
${p>0?'<button style="width:100%;margin-top:10px;color:var(--hi)" id="pz">Salah catat? Reset pembayaran</button>':''}`);
const apply=a=>{const x=Math.min(a,r);o.paidAmt=p+x;if(sisa(o)<=0&&o.status<3)o.status=3;save();close();render();
toast(`<span>${sisa(o)>0?'Tercatat sebagian ✔ sisa '+rb(sisa(o)):'Lunas ✔'}</span>`+(c.wa?`<a class="wa" target="_blank" rel="noopener" href="${waLink(c.wa,payMsg(o,x))}">Kabari WA</a>`:''))};
if(r>0){$('#pf').onclick=()=>apply(r);$('#pp').onclick=()=>{const a=Math.round(num(String($('#pn').value).replace(/\./g,'')));if(a<=0)return toast('Isi nominalnya dulu ya',2500);apply(a)}}
if(p>0)$('#pz').onclick=()=>{const b=$('#pz');if(!b.dataset.cf){b.dataset.cf=1;return b.textContent='Yakin? Ketuk lagi untuk reset ke Rp 0'}o.paidAmt=0;if(o.status===3)o.status=2;save();close();render()}}

function byCust(){return S.customers.map(c=>({c,...stat(vo().filter(o=>o.cid===c.id))})).filter(x=>x.n)}
function topCat(){const m={};vo().filter(bought).forEach(o=>m[o.cat]=(m[o.cat]||0)+sell(o));const a=Object.entries(m).sort((x,y)=>y[1]-x[1])[0];return a?a[0]:'-'}
function summary(){const s=stat(vo()),bc=byCust().sort((a,b)=>b.rev-a.rev)[0];
return `✈️ Rekap ${vname()}\n\nPesanan dibeli: ${s.nb} dari ${s.n}\nSudah Done (terkirim): ${vo().filter(o=>o.status===5).length}\nOmzet: ${idr(s.rev)}\nModal: ${idr(s.c)}\nUntung bersih: ${idr(s.m)}${s.rev?' ('+(s.m/s.rev*100).toFixed(1).replace('.',',')+'%)':''}\nUang masuk: ${idr(s.paid)}\nBelum dibayar: ${idr(s.out)}\nPelanggan teratas: ${bc&&bc.rev?bc.c.name+' ('+rb(bc.rev)+')':'-'}\nKategori terlaris: ${topCat()}`}

function vD(){const s=stat(vo()),bc=byCust().sort((a,b)=>b.rev-a.rev),mx=Math.max(1,...bc.map(x=>x.rev));
const used=[...new Set(vo().map(o=>o.cur).concat(S.trip.cur))];
return `${tripBar()}${S.ratesAt?'':'<div class="warn">Kurs masih angka perkiraan. Cek & isi kurs asli di bawah sebelum mulai belanja ya.</div>'}
<div class="hero"><span class="sub" style="color:inherit;opacity:.75">Untung bersih (barang yang sudah dibeli)</span><b>${idr(s.m)}</b>
<span style="opacity:.8">Omzet ${idr(s.rev)} − modal ${idr(s.c)}</span></div>
<div class="grid"><div class="card"><span class="fx">Total pesanan</span><b>${s.n} <span class="fx">(${s.nb} dibeli)</span></b></div>
<div class="card"><span class="fx">Uang masuk</span><b>${idr(s.paid)}</b></div>
<div class="card"><span class="fx">Belum dibayar</span><b style="color:var(--hi)">${idr(s.out)}</b></div>
<div class="card"><span class="fx">Masih dicari/belum dibeli</span><b>${idr(s.wait)}</b></div></div>
<h2>Per pelanggan</h2>${bc.length?bc.map(x=>`<div class="card"><div class="row"><span class="who">${e(x.c.name)}</span><span><b>${idr(x.rev)}</b></span></div>
<div class="fx">${x.n} pesanan · untung ${rb(x.m)}${x.out>0?' · utang '+rb(x.out):''}</div><div class="bar"><i style="width:${x.rev/mx*100}%"></i></div></div>`).join(''):'<div class="sub">Belum ada data.</div>'}
<h2>Kurs (Rp per 1 mata uang)</h2><div class="card">${used.map(c=>`<label>${c}</label><input inputmode="decimal" data-r="${c}" value="${S.rates[c]??''}">`).join('')}
<button class="primary" style="background:var(--ink);color:var(--bg)" id="live">Coba ambil kurs terbaru</button>
<div class="fx" style="margin-top:6px">${S.ratesAt?'Terakhir diatur: '+S.ratesAt:'Belum pernah diatur'}. Kurs tiap pesanan dikunci saat dicatat, jadi ganti kurs nggak mengubah pesanan lama.</div></div>
<h2>Akhir trip</h2><pre>${e(summary())}</pre>
<div class="acts"><a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(summary())}" style="flex:1">Bagikan ke WA</a><button id="bak">Simpan cadangan</button></div>
<input type="file" id="imp" accept=".json,application/json" hidden><button style="width:100%;margin-top:8px" data-imp="1">Pulihkan dari cadangan</button>
${histTrips()}${S.view==='all'||vid()!==S.tripId?'':`<button class="primary" style="background:var(--soft);color:var(--ink);margin-top:10px" id="newtrip">Tutup trip (cutoff)</button><div class="fx" style="margin-top:6px">Cutoff cuma menutup trip ini dan membuka trip baru. Pesanan, pembayaran, dan resi kargo tetap tersimpan, dan trip lama bisa dibuka lagi kapan saja.</div>`}`}

function orderSheet(id){const o=S.orders.find(x=>x.id===id)||{cid:S.customers[0]?.id||'',item:'',store:'',cat:CAT[0],cur:S.trip.cur,amt:'',qty:1,markup:S.trip.markup,mt:S.trip.mt||'pct'};
let photo=o.photo||'';
sheet(`<h1>${id?'Ubah pesanan':'Pesanan baru'}</h1>
<label>Pelanggan</label><select id="f-c">${S.customers.map(c=>`<option value="${c.id}" ${c.id===o.cid?'selected':''}>${e(c.name)}</option>`).join('')}<option value="+">+ Pelanggan baru…</option></select>
<div id="nc" hidden><label>Nama pelanggan baru</label><input id="f-nn" placeholder="mis. Bu Yuni"><label>Nomor WhatsApp</label><input id="f-nw" inputmode="tel" placeholder="0812…"></div>
<label>Barang</label><input id="f-i" value="${e(o.item)}" placeholder="mis. Hada Labo Gokujyun">
<label>Toko</label><input id="f-s" value="${e(o.store)}" placeholder="mis. Matsumoto Kiyoshi">
<div class="two"><div><label>Kategori</label><select id="f-k">${CAT.map(k=>`<option ${k===o.cat?'selected':''}>${k}</option>`).join('')}</select></div><div><label>Dibawa lewat</label><select id="f-pm"><option value="kargo" ${(o.pm||'kargo')==='kargo'?'selected':''}>Kargo</option><option value="koper" ${o.pm==='koper'?'selected':''}>Koper</option></select></div></div>
<div class="two"><div><label>Mata uang</label><select id="f-u">${Object.keys(S.rates).map(c=>`<option ${c===o.cur?'selected':''}>${c}</option>`).join('')}</select></div>
<div><label>Harga per pcs</label><input id="f-a" inputmode="decimal" value="${o.amt}"></div></div>
<label>Jumlah</label><input id="f-q" inputmode="numeric" value="${o.qty}">
<label>Markup (untung)</label><div class="two"><select id="f-mt"><option value="pct" ${o.mt!=='idr'?'selected':''}>Persen (%)</option><option value="idr" ${o.mt==='idr'?'selected':''}>Nominal (Rp per pcs)</option></select><input id="f-m" inputmode="decimal" value="${o.markup}" aria-label="Besar markup"></div>
<label>Foto produk</label><div id="pb"></div>
<input type="file" id="p-cam" accept="image/*" capture="environment" hidden><input type="file" id="p-gal" accept="image/*" hidden>
<div class="prev" id="pv"></div>
<button class="primary" id="f-ok">${id?'Simpan':'Catat pesanan'}</button>
<button style="width:100%;margin-top:8px" id="scan">📷 Foto struk (isi otomatis)</button><input type="file" id="f-f" accept="image/*" capture="environment" hidden>
<div id="sr"></div>${id?'<button style="width:100%;margin-top:8px;color:var(--hi)" id="del">Hapus pesanan</button>':''}`);
const pv=()=>{const cur=$('#f-u').value,r=S.rates[cur]||0,a=num($('#f-a').value)*Math.max(1,num($('#f-q').value))*r,m=num($('#f-m').value),t=$('#f-mt').value,p=Math.ceil((a+(t==='idr'?m*Math.max(1,num($('#f-q').value)):a*m/100))/500)*500;
$('#pv').innerHTML=a?`Modal ≈ ${idr(a)}<br>Jual ${idr(p)} <span class="fx">(untung ${idr(p-a)})</span>`:'Isi harga dulu, nanti kuhitungin ke rupiah.'};
['f-u','f-a','f-q','f-m','f-mt'].forEach(i=>$('#'+i).oninput=pv);pv();
$('#f-mt').onchange=()=>{const i=$('#f-m'),n=num(i.value),t=$('#f-mt').value;if(t==='idr'&&n<1000)i.value='';if(t==='pct'&&n>100)i.value=S.trip.mt==='pct'?S.trip.markup:15;pv()};
const paint=()=>{$('#pb').innerHTML=photo?`<img class="big" src="${photo}" alt="Foto produk"><button id="pr" style="width:100%;margin-top:6px">Hapus foto</button>`:'<div class="two"><button id="pc">📷 Kamera</button><button id="pg">🖼 Galeri</button></div>';
if(photo)$('#pr').onclick=()=>{photo='';paint()};else{$('#pc').onclick=()=>$('#p-cam').click();$('#pg').onclick=()=>$('#p-gal').click()}};
const pick=async ev=>{const f=ev.target.files[0];if(!f)return;try{photo=await shrink(f);paint()}catch(x){toast('Fotonya nggak bisa dibuka, coba foto lain ya',3000)}};
$('#p-cam').onchange=pick;$('#p-gal').onchange=pick;paint();
$('#f-c').onchange=()=>{$('#nc').hidden=$('#f-c').value!=='+'};$('#nc').hidden=$('#f-c').value!=='+';
$('#f-ok').onclick=async()=>{let cid=$('#f-c').value;
if(cid==='+'){const n=$('#f-nn').value.trim();if(!n)return toast('Isi nama pelanggannya dulu ya',2500);cid=uid();S.customers.push({id:cid,name:n,wa:$('#f-nw').value.trim(),notes:''})}
if(!cid)return toast('Pilih pelanggan dulu ya',2500);
const item=$('#f-i').value.trim(),amt=num($('#f-a').value);if(!item||!amt)return toast('Nama barang & harga wajib diisi',2500);
const cur=$('#f-u').value;if(!S.rates[cur])return toast('Kurs '+cur+' belum diisi',2500);
const orderId=id||uid(),old=S.orders.find(z=>z.id===id),oldPhoto=old?.photo||'',oldPath=old?.photoPath||'',newPhotoIsData=typeof photo==='string'&&photo.startsWith('data:image/');
const d={cid,item,store:$('#f-s').value.trim(),cat:$('#f-k').value,cur,amt,qty:Math.max(1,Math.round(num($('#f-q').value))||1),markup:num($('#f-m').value),mt:$('#f-mt').value,photo:newPhotoIsData?'':photo,photoPath:newPhotoIsData?(oldPath||''):photo?oldPath:'',pm:$('#f-pm').value};
if(id){const x=old;Object.assign(x,d);if(!x.rate||x.cur!==cur)x.rate=S.rates[cur]}
else{S.orders.push({...d,id:orderId,rate:S.rates[cur],status:0,paidAmt:0,tripId:S.tripId,ts:Date.now()});if(S.view!=='all')S.view='cur'}
S.trip.cur=cur;S.trip.markup=d.markup;S.trip.mt=d.mt;save();close();render();
if(newPhotoIsData){toast('Pesanan tersimpan. Mengunggah foto…',4000);try{const r=await uploadPhoto(orderId,photo);const x=S.orders.find(z=>z.id===orderId);if(x){x.photo=r.url;x.photoPath=r.path;save();render();toast('Foto tersimpan di Firebase Storage ✔',2500)}}catch(err){console.error(err);toast('Pesanan tersimpan, tapi foto gagal diunggah. Coba edit pesanan lalu pilih foto lagi.',6000)}}
else if(old&&oldPhoto&&!photo){await deletePhoto(oldPath);if(old){old.photoPath='';save()}}
else toast(id?'Tersimpan ✔':'Pesanan dicatat ✔',2500)};
if(id){$('#del').onclick=()=>{if($('#del').dataset.cf){S.orders=S.orders.filter(x=>x.id!==id);save();close();render()}else{$('#del').dataset.cf=1;$('#del').textContent='Yakin hapus? Ketuk lagi'}}}
$('#scan').onclick=()=>$('#f-f').click();
$('#f-f').onchange=async ev=>{
 const f=ev.target.files[0];if(!f)return;
 const r=$('#sr');
 r.innerHTML='<div class="warn">Scan struk otomatis tidak disertakan dalam versi Firebase ini. Foto struk tetap dapat disimpan, sedangkan detail barang diisi manual.</div>';
};
}

const SHIP=['Diproses forwarder','OTW Indonesia','Tiba di Indonesia','Done'];
const shipIds=()=>Object.keys(S.ships).filter(r=>S.orders.some(o=>o.resi===r));
function vP(){const bo=S.orders.filter(bought),k=shipIds(),kp=bo.filter(o=>(o.pm||'kargo')==='koper'&&!o.resi),h0=`<div class="chips"><button class="chip ${S.pk==='k'||S.pk==='kp'?'':'on'}" data-pk="siap">Perlu dipacking</button><button class="chip ${S.pk==='kp'?'on':''}" data-pk="kp">Koper (${kp.length})</button><button class="chip ${S.pk==='k'?'on':''}" data-pk="k">Kargo forwarder (${k.length})</button></div>`;
if(S.pk==='k')return h0+vK(k);
if(S.pk==='kp')return h0+vKp(kp);
const pkd=bo.filter(o=>o.packed).length,pc=bo.length?Math.round(pkd/bo.length*100):0,L=bo.filter(o=>!o.resi);
S.pick=S.pick.filter(id=>L.some(o=>o.id===id&&(o.pm||'kargo')==='kargo'));
let h=h0+`<div class="hero"><span style="opacity:.75">Progress packing</span><b>${pkd} / ${bo.length} barang (${pc}%)</b><div class="bar"><i style="width:${pc}%;background:var(--sun)"></i></div></div>`;
if(!L.length)return h+`<div class="empty">${bo.length?'Semua barang sudah masuk resi. Lihat tab Kargo forwarder.':'Belum ada barang yang dibeli.<br>Ubah status pesanan jadi <b>Dibeli</b> dulu.'}</div>`;
const g={};L.forEach(o=>(g[o.cid]=g[o.cid]||[]).push(o));
const cb='style="width:22px;min-height:22px"',lb='style="margin:0;display:flex;gap:6px;align-items:center"';
h+=Object.keys(g).map(cid=>`<div class="card"><div class="who">${e(cust(cid).name)}</div>`+g[cid].map(o=>{const kg=(o.pm||'kargo')==='kargo';
return `<div class="row" style="margin-top:10px;align-items:center">${o.photo?`<img class="thumb" src="${o.photo}" data-z="${o.id}" alt="">`:''}<div style="flex:1;min-width:0"><div class="item">${e(o.item)}${o.qty>1?' ×'+o.qty:''}</div><div class="fx">${e(o.store||'toko ?')}${o.tripId!==S.tripId?' · '+e(tname(o.tripId)):''}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center"><label ${lb}><input type="checkbox" ${cb} data-pkd="${o.id}" ${o.packed?'checked':''}>Sudah dipacking</label>
<select data-pm="${o.id}" style="width:auto;min-height:36px"><option value="kargo" ${kg?'selected':''}>Kargo</option><option value="koper" ${kg?'':'selected'}>Koper</option></select>
${kg?`<label ${lb}><input type="checkbox" ${cb} data-pick="${o.id}" ${S.pick.includes(o.id)?'checked':''}>Masuk resi</label>`:''}</div></div></div>`}).join('')+'</div>').join('');
return h+(S.pick.length?`<button class="primary" data-ship="">Buat resi kargo (${S.pick.length} barang)</button>`:'<div class="fx" style="text-align:center;margin-top:10px">Centang "Masuk resi" di barang kargo, lalu buat resi kalau forwarder sudah memproses.</div>')}
function tripBar(){if(S.trips.length<2)return '';const cur=S.view||'cur';
const o=[['cur','Trip aktif: '+S.trip.name]].concat(S.trips.filter(t=>t.closedAt).map(t=>[t.id,t.name+' (ditutup)']),[['all','Semua trip']]);
return `<select data-tv="1" aria-label="Pilih trip" style="margin:6px 0">${o.map(([v,l])=>`<option value="${e(v)}" ${v===cur?'selected':''}>${e(l)}</option>`).join('')}</select>`}
function histTrips(){const cl=S.trips.filter(t=>t.closedAt);if(!cl.length)return '';
return '<h2>Trip yang sudah ditutup</h2>'+cl.slice().reverse().map(t=>{const os=S.orders.filter(o=>o.tripId===t.id),x=stat(os),rs=[...new Set(os.map(o=>o.resi).filter(Boolean))],open=rs.filter(r=>(S.ships[r]||{}).st!==3).length,pend=os.filter(o=>o.status<5).length;
return `<div class="card"><div class="row"><div class="who">${e(t.name)}</div><span class="fx">ditutup ${new Date(t.closedAt).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</span></div>
<div class="fx">${os.length} pesanan · omzet ${rb(x.rev)} · untung ${rb(x.m)}<br>Belum dibayar ${rb(x.out)} · belum Done ${pend} pesanan · kargo masih jalan ${open} resi</div>

function vKp(L){const todo=L.filter(o=>!o.packed),done=L.length-todo.length,pc=L.length?Math.round(done/L.length*100):0;
S.kp=S.kp.filter(id=>todo.some(o=>o.id===id));

<div class="fx" style="margin:8px 0">${os.map(o=>e(cust(o.cid).name+': '+o.item+' ×'+o.qty)).join('<br>')}</div>

function shipText(r){const os=S.orders.filter(o=>o.resi===r),m=S.ships[r]||{};
return `📦 Packing list kargo ${r}\n${m.mk?'Marking: '+m.mk+'\n':''}${m.fw?'Forwarder: '+m.fw+'\n':''}Status: ${SHIP[m.st||0]}\n\n`+os.map((o,i)=>`${i+1}. [${cust(o.cid).name}] ${o.item} ×${o.qty}${S.pdfPrice!==false?' – '+rb(sell(o)):''}`).join('\n')}
function shipSheet(r){const m=r?S.ships[r]:{fw:'',st:0},ids=r?S.orders.filter(o=>o.resi===r).map(o=>o.id):S.pick.slice(),ck='style="width:22px;min-height:22px"';
sheet(`<h1>${r?'Ubah resi kargo':'Buat resi kargo'}</h1><div class="sub">${ids.length} barang</div>
<label>Nomor resi</label><input id="s-r" value="${e(r||'')}" placeholder="mis. KG-2026-9988"><label>Kode marking (pembeda kargo udara / laut)</label><input id="s-m" value="${e(m.mk||'')}" placeholder="mis. UDR-ABC atau LT-ABC">
<label>Nama forwarder</label><input id="s-f" value="${e(m.fw||'')}" placeholder="mis. nama jasa kargo">
<label>Status kiriman</label><select id="s-s">${SHIP.map((t,i)=>`<option value="${i}" ${(m.st||0)===i?'selected':''}>${t}</option>`).join('')}</select>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s-p" ${ck} ${S.pdfPrice!==false?'checked':''}>Tampilkan harga jual di PDF</label>
<button class="primary" id="s-ok">${r?'Simpan perubahan':'Buat resi'}</button>
${r?'<button class="primary" style="background:var(--ink);color:var(--bg)" id="s-pdf">Simpan PDF</button><button style="width:100%;margin-top:8px;color:var(--hi)" id="s-del">Bongkar resi (barang balik ke daftar packing)</button>':''}
<button style="width:100%;margin-top:8px" id="s-x">Tutup</button>`);
$('#s-x').onclick=close;
const read=()=>{const n=$('#s-r').value.trim();if(!n){toast('Isi nomor resi dulu ya',2500);return}
if(n!==r&&S.ships[n]){toast('Nomor resi itu sudah dipakai',2500);return}
S.pdfPrice=$('#s-p').checked;if(r&&n!==r){delete S.ships[r];S.orders.forEach(o=>{if(o.resi===r)o.resi=n})}
S.ships[n]={fw:$('#s-f').value.trim(),mk:$('#s-m').value.trim(),st:+$('#s-s').value,ts:m.ts||Date.now()};
if(!r){S.orders.forEach(o=>{if(ids.includes(o.id)){o.resi=n;o.packed=true}});S.pick=[];S.pk='k'}
save();return n};
$('#s-ok').onclick=()=>{if(read()){close();render()}};
if(r){$('#s-pdf').onclick=()=>{const n=read();if(n){render();savePdf(n)}};
$('#s-del').onclick=()=>{const b=$('#s-del');if(!b.dataset.cf){b.dataset.cf=1;return b.textContent='Yakin? Ketuk lagi'}S.orders.forEach(o=>{if(o.resi===r)o.resi=''});delete S.ships[r];save();close();render()}}}
function pdfBlob(r,price){const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,M=14,m=S.ships[r]||{},os=S.orders.filter(o=>o.resi===r),T=(t,x,y,o)=>d.text(String(t),x,y,o);let y=M,grand=0;
d.setFont('helvetica','bold');d.setFontSize(15);T('PACKING LIST KARGO',M,y+5);d.setFontSize(11);T('Resi: '+r,W-M,y+5,{align:'right'});if(m.mk){d.setFontSize(10);T('Marking: '+m.mk,W-M,y+11,{align:'right'})}
d.setFont('helvetica','normal');d.setFontSize(9);y+=11;T([...new Set(os.map(o=>tname(o.tripId)))].join(', ')+'  |  '+new Date().toLocaleDateString('id-ID',{dateStyle:'long'}),M,y);y+=5;
T('Forwarder: '+(m.fw||'-')+'  |  Status: '+SHIP[m.st||0]+'  |  Total: '+os.reduce((x,o)=>x+o.qty,0)+' pcs',M,y);y+=4;d.setDrawColor(150);d.line(M,y,W-M,y);y+=6;
const g={};os.forEach(o=>(g[o.cid]=g[o.cid]||[]).push(o));
for(const cid in g){const c=cust(cid);let sub=0;if(y>255){d.addPage();y=M}
d.setFillColor(228,239,233);d.rect(M,y,W-2*M,7,'F');d.setFont('helvetica','bold');d.setFontSize(10);T(c.name+(c.wa?'  ('+c.wa+')':''),M+2,y+5);y+=10;
for(const o of g[cid]){const nm=d.splitTextToSize(o.item+(o.store?' ('+o.store+')':''),price?100:140),h=Math.max(o.photo?14:0,nm.length*4.5+3);
if(y+h>278){d.addPage();y=M}
if(o.photo){try{const q=d.getImageProperties(o.photo),k=Math.min(12/q.width,12/q.height);d.addImage(o.photo,'JPEG',M,y,q.width*k,q.height*k)}catch(x){}}
d.setFont('helvetica','normal');d.setFontSize(9);d.text(nm,M+16,y+4);T('x'+o.qty,M+(price?122:150),y+4);
if(price){T(idr(sell(o)),W-M,y+4,{align:'right'});sub+=sell(o)}
d.setDrawColor(215);d.line(M,y+h,W-M,y+h);y+=h+2}
if(price){d.setFont('helvetica','bold');T('Subtotal: '+idr(sub),W-M,y+3,{align:'right'});y+=7;grand+=sub}y+=4}
if(price){if(y>270){d.addPage();y=M}d.setFont('helvetica','bold');d.setFontSize(11);T('TOTAL HARGA JUAL: '+idr(grand),W-M,y+4,{align:'right'})}
return d.output('blob')}
async function savePdf(r){if(!window.jspdf)return toast('Pembuat PDF belum termuat. Cek internet lalu coba lagi.',4000);
try{const b=pdfBlob(r,S.pdfPrice!==false),fn='packing-list-'+r.replace(/[^\w-]+/g,'_')+'.pdf';
const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
catch(er){if(er&&er.code==='declined')return;toast('PDF gagal dibuat, coba lagi ya',4000)}}
addEventListener('input',ev=>{if(ev.target.id==='qs'){S.q=ev.target.value;render();const el=$('#qs');el.focus();el.setSelectionRange(el.value.length,el.value.length)}});
addEventListener('change',ev=>{const t=ev.target,d=t.dataset,f=id=>S.orders.find(x=>x.id===id);
if(d.pkd){f(d.pkd).packed=t.checked;save();render()}else if(d.pm){f(d.pm).pm=t.value;save();render()}
else if(d.kp){S.kp=t.checked?S.kp.concat(d.kp):S.kp.filter(x=>x!==d.kp);render()}else if(d.tv){S.view=t.value;S.filter=-1;save();render()}else if(d.pick){S.pick=t.checked?S.pick.concat(d.pick):S.pick.filter(x=>x!==d.pick);save();render()}
else if(t.id==='imp'){const fl=t.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j||!(j.orders||j.customers))throw 0;S=Object.assign(def(),j);ensureTrip();save();render();toast('Cadangan dipulihkan ✔',3000)}catch(x){toast('File cadangan nggak valid',3000)}};rd.readAsText(fl)}});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,ev=>ev.preventDefault()));
document.addEventListener('touchmove',ev=>{if(ev.touches.length>1)ev.preventDefault()},{passive:false});
async function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),fn='jastip-cadangan.json';
const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function shrink(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(f)})}
function custSheet(id){const c=S.customers.find(x=>x.id===id)||{name:'',wa:'',notes:''};
sheet(`<h1>${id?'Ubah pelanggan':'Pelanggan baru'}</h1><label>Nama</label><input id="c-n" value="${e(c.name)}" placeholder="mis. Bu Yuni"><label>Nomor WhatsApp</label><input id="c-w" inputmode="tel" value="${e(c.wa)}" placeholder="0812…">
<label>Catatan (barang favorit, cara antar)</label><textarea id="c-t" rows="3">${e(c.notes)}</textarea><button class="primary" id="c-ok">Simpan</button>${id?'<button style="width:100%;margin-top:8px;color:var(--hi)" id="c-del">Hapus pelanggan</button>':''}`);
$('#c-ok').onclick=()=>{const n=$('#c-n').value.trim();if(!n)return toast('Nama wajib diisi',2500);const d={name:n,wa:$('#c-w').value.trim(),notes:$('#c-t').value.trim()};
id?Object.assign(c,d):S.customers.push({id:uid(),...d});save();close();render()};
if(id)$('#c-del').onclick=()=>{const b=$('#c-del');if(S.orders.some(o=>o.cid===id))return b.textContent='Masih punya pesanan, hapus pesanannya dulu';if(!b.dataset.cf){b.dataset.cf=1;return b.textContent='Yakin hapus? Ketuk lagi'}S.customers=S.customers.filter(x=>x.id!==id);save();close();render()}}

async function deleteTrip(id){
const t=S.trips.find(x=>x.id===id);
if(!t)return;
if(!t.closedAt){toast('Trip aktif tidak bisa dihapus. Tutup trip dulu.',3500);return}
const os=S.orders.filter(o=>o.tripId===id);
const resis=[...new Set(os.map(o=>o.resi).filter(Boolean))];
if(!confirm(`Hapus trip "${t.name}" beserta ${os.length} pesanan di dalamnya? Data ini tidak bisa dikembalikan kecuali dari file cadangan.`))return;

toast('Menghapus trip…',5000);

// Hapus foto lama dari Firebase Storage bila ada. Kegagalan Storage tidak
// menghentikan penghapusan data Firestore agar trip tetap bisa dibersihkan.
let photoFail=0;
for(const o of os){
  if(o.photoPath){
    try{await deletePhoto(o.photoPath)}catch(err){photoFail++;console.warn('Gagal menghapus foto',o.id,err)}
  }
}

// Hapus trip dan seluruh pesanan trip dari data lokal.
// Customer sengaja tidak dihapus karena bisa dipakai trip lain.
S.orders=S.orders.filter(o=>o.tripId!==id);
S.trips=S.trips.filter(x=>x.id!==id);

// Resi yang tidak lagi dipakai oleh pesanan mana pun ikut dibersihkan.
for(const r of resis){
  if(!S.orders.some(o=>o.resi===r))delete S.ships[r];
}

// Pastikan selalu ada trip aktif.
if(!S.trips.length){
  const nid=uid();
  S.trips=[{id:nid,name:'Trip baru',ts:Date.now()}];
  S.tripId=nid;
  S.trip={name:'Trip baru',markup:15,cur:'JPY',mt:'pct'};
}else if(!S.trips.some(x=>x.id===S.tripId)){
  const active=S.trips.find(x=>!x.closedAt)||S.trips[S.trips.length-1];
  S.tripId=active.id;
  S.trip={...S.trip,name:active.name};
}
S.view='cur';S.filter=-1;S.tab='d';
save();render();

toast(photoFail?`Trip dihapus. ${photoFail} foto gagal ikut dihapus dari Storage.`:'Trip dan semua pesanannya berhasil dihapus ✔',4500);
}

function tripSheet(){sheet(`<h1>Atur trip</h1><label>Nama trip</label><input id="t-n" value="${e(S.trip.name)}" placeholder="mis. Osaka Oktober">
<label>Markup standar</label><div class="two"><select id="t-mt"><option value="pct" ${S.trip.mt!=='idr'?'selected':''}>Persen (%)</option><option value="idr" ${S.trip.mt==='idr'?'selected':''}>Nominal (Rp per pcs)</option></select><input id="t-m" inputmode="decimal" value="${S.trip.markup}" aria-label="Besar markup standar"></div><button class="primary" id="t-ok">Simpan</button>`);
$('#t-ok').onclick=()=>{S.trip.name=$('#t-n').value.trim()||'Trip baru';{const ct=S.trips.find(x=>x.id===S.tripId);if(ct)ct.name=S.trip.name}S.trip.markup=num($('#t-m').value);S.trip.mt=$('#t-mt').value;save();close();render()}}

document.addEventListener('click',ev=>{const z=ev.target.closest('[data-z]');if(z){const o=S.orders.find(x=>x.id===z.dataset.z);if(o)sheet(`<div class="who">${e(o.item)}</div><img class="big" style="max-height:70vh" src="${o.photo}" alt="Foto ${e(o.item)}"><button class="primary" id="zc">Tutup</button>`);return}
const t=ev.target.closest('button');if(!t)return;const d=t.dataset;
if(t.id==='zc')return close();
if(d.t){S.tab=d.t;save();render()}else if(d.f){S.filter=+d.f;render()}
else if(d.s){const[i,n]=d.s.split(':');reqStatus(i,+n)}else if(d.pay)paySheet(d.pay);else if(d.pk){S.pk=d.pk;save();render()}else if(d.shipdone){S.ships[d.shipdone].st=3;save();render()}else if(d.tv){S.view=d.tv;S.filter=-1;S.tab='q';save();render()}else if(d.dtrip){deleteTrip(d.dtrip)}
else if(d.kpall){const td=S.orders.filter(o=>bought(o)&&(o.pm||'kargo')==='koper'&&!o.resi&&!o.packed).map(o=>o.id);S.kp=S.kp.length===td.length?[]:td;render()}else if(d.kpok){S.orders.forEach(o=>{if(S.kp.includes(o.id))o.packed=true});S.kp=[];save();render()}else if(d.kpundo){S.orders.find(x=>x.id===d.kpundo).packed=false;save();render()}else if(d.ship!==undefined)shipSheet(d.ship||null);else if(d.pdf)savePdf(d.pdf);else if(d.imp){if(!t.dataset.cf){t.dataset.cf=1;t.textContent='Ini menimpa data sekarang. Ketuk lagi untuk pilih file';return}$('#imp').click()}else if(d.eo)orderSheet(d.eo);else if(d.ec!==undefined)custSheet(d.ec);
else if(t.id==='fab')orderSheet();else if(t.id==='gear')tripSheet();
else if(t.id==='bak')backup()
else if(t.id==='newtrip'){if(!t.dataset.cf){t.dataset.cf=1;t.textContent='Yakin cutoff? Pesanan lama tetap tersimpan. Ketuk lagi';return}
const ct=S.trips.find(x=>x.id===S.tripId);ct.name=S.trip.name;ct.closedAt=Date.now();const nid=uid();S.trips.push({id:nid,name:'Trip baru',ts:Date.now()});S.tripId=nid;S.trip.name='Trip baru';S.view='cur';S.filter=-1;S.tab='q';save();render()}
else if(t.id==='live')live(t)});
document.addEventListener('input',ev=>{const c=ev.target.dataset.r;if(c){S.rates[c]=num(ev.target.value);S.ratesAt=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});save()}});
async function live(b){b.textContent='Lagi ambil kurs…';try{const ac=new AbortController();setTimeout(()=>ac.abort(),7000);
const j=await (await fetch('https://open.er-api.com/v6/latest/IDR',{signal:ac.signal})).json();
Object.keys(S.rates).forEach(c=>{if(j.rates&&j.rates[c])S.rates[c]=Math.round(1/j.rates[c]*100)/100});
S.ratesAt=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})+' (otomatis)';save();render();toast('Kurs terbaru masuk ✔',3000)}
catch(er){b.textContent='Coba ambil kurs terbaru';toast('Kurs otomatis belum bisa diambil di sini. Isi manual ya.',4500)}}
render();
